<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Todo</title>
<meta name="theme-color" content="#312E81">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Todo">
<script>
/* =========================================================
 *  সার্ভারের সাথে যোগাযোগ — GitHub Pages সংস্করণ
 *  API_URL = Apps Script-এর "Anyone" deployment-এর /exec লিংক।
 *  এই পেজ public, তাই এখানে কোনো গোপন তথ্য নেই — নিরাপত্তা আসে
 *  লগইন টোকেন থেকে, যেটা সার্ভার প্রতিটা কলে যাচাই করে (WebApi ফাইল)।
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbzfURT7GIES1X5-vRcDwhBanLsytp7_N-olyF1ivANYIk95r4ocSrVQwIMGGK3jpxoUrg/exec';

/* লগইন টোকেন — ইমেইল-কোড দিয়ে একবার ঢুকলে এই ব্রাউজারে থাকে।
 * storage বন্ধ থাকলে অন্তত এই সেশনে মেমরিতে থাকে। */
var AUTH_KEY = 'todo_auth';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else localStorage.removeItem(AUTH_KEY); } catch (e) {}
}

/* text/plain POST — এতে ব্রাউজার আলাদা preflight পাঠায় না, Apps Script-এ সরাসরি যায় */
function callServer(fn, args) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH })
  }).then(function (r) {
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ') — একটু পরে আবার চেষ্টা করুন।');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি — deployment ঠিক আছে কি না দেখুন।'); });
  }, function () {
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট সংযোগ দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা সমস্যা।');
    return j.data;
  });
}
</script>
<!-- 🔔 নোটিফিকেশন widget (মূল কপি _shared/notify — বিল্ড কপি করে) -->
<script src="ntf.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ টোকেন ============ */
  :root {
    --bg: #F3F4F9; --surface: #FFFFFF; --surface-2: #F1F3F9; --surface-3: #E6E9F2;
    --ink: #141831; --ink-2: #565D7E; --ink-3: #979DB7; --line: #E3E6EF;
    --brand: #4F46E5; --ok: #059669; --warn: #D97706; --danger: #E11D48;
    --hero-1: #1E1B4B; --hero-2: #4338CA; --hero-3: #7C3AED;
    --shadow: 0 1px 2px rgba(20,24,49,.05), 0 4px 14px -6px rgba(20,24,49,.12);
    --shadow-lg: 0 20px 44px -12px rgba(20,24,49,.4);
    --r: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0F1E; --surface: #161931; --surface-2: #1D2140; --surface-3: #2A2F55;
      --ink: #ECEEFA; --ink-2: #A8AECB; --ink-3: #6E7497; --line: #272C4B;
      --brand: #818CF8;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 'Inter', 'Hind Siliguri', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(86px + env(safe-area-inset-bottom));
  }
  body.lock { overflow: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .ic { flex: none; display: block; }
  #app { max-width: 560px; margin: 0 auto; }

  /* ============ লগইন পাতা — পর্দার মাঝখানে একটা কার্ড ============ */
  body.is-login {
    padding-bottom: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(99,102,241,.55) 0, transparent 45%),
      radial-gradient(circle at 90% 95%, rgba(219,39,119,.38) 0, transparent 42%),
      #14122B;
  }
  body.is-login .hero, body.is-login .nav, body.is-login .fab { display: none !important; }
  body.is-login #app { max-width: none; }
  body.is-login main { padding: 0; }
  .lg-wrap {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .lg-card {
    width: 100%; max-width: 410px; background: var(--surface); border-radius: 24px; overflow: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06);
    animation: lgIn .35s ease-out;
  }
  @keyframes lgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .lg-head {
    text-align: center; color: #fff; padding: 30px 24px 24px;
    background:
      radial-gradient(120% 130% at 100% 0%, rgba(124,58,237,.95) 0%, transparent 55%),
      radial-gradient(80% 90% at 0% 100%, rgba(14,165,233,.35) 0%, transparent 60%),
      linear-gradient(135deg, var(--hero-1), var(--hero-2));
  }
  .lg-logo {
    display: block; width: 78px; height: 78px; margin: 0 auto 14px; border-radius: 50%; object-fit: contain;
    background: #fff; padding: 3px; box-shadow: 0 0 0 3px rgba(255,255,255,.3), 0 10px 24px rgba(15,10,60,.45);
  }
  .lg-org { font-size: 21px; font-weight: 800; letter-spacing: .01em; line-height: 1.25; }
  .lg-app { margin-top: 5px; font-size: 11px; font-weight: 700; letter-spacing: .26em; opacity: .78; }
  .lg-head .owner { margin-top: 14px; }
  .lg-body { padding: 24px 24px 22px; }
  .lg-body h2 { margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 9px; }
  .lg-body h2 .ic { color: var(--brand); }
  .lg-sub { margin: 6px 0 16px; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .lg-sub b { color: var(--ink); word-break: break-all; }
  .lg-body .inp { padding: 13px 14px; font-size: 15px; }
  .lg-code { font-size: 22px !important; letter-spacing: .35em; text-align: center; font-weight: 700; }
  .lg-actions { display: flex; gap: 8px; margin-top: 14px; }
  .lg-actions .btn { padding-top: 13px; padding-bottom: 13px; }
  .lg-steps { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
  .lg-steps i { width: 22px; height: 5px; border-radius: 99px; background: var(--surface-3); }
  .lg-steps i.on { background: var(--brand); }
  .lg-foot {
    margin-top: 18px; max-width: 410px; display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 12px; font-weight: 500; color: rgba(255,255,255,.62); text-align: center;
  }
  .lg-foot .ic { flex: none; color: rgba(255,255,255,.75); }

  /* ============ হেডার ============ */
  .hero {
    color: #fff; padding: 14px 16px 16px; border-radius: 0 0 24px 24px;
    background:
      radial-gradient(120% 130% at 100% 0%, rgba(124,58,237,.95) 0%, transparent 55%),
      radial-gradient(80% 90% at 0% 100%, rgba(14,165,233,.35) 0%, transparent 60%),
      linear-gradient(135deg, var(--hero-1), var(--hero-2));
    box-shadow: 0 10px 30px -14px rgba(49,46,129,.7);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; opacity: .7; }
  .hero h1 { margin: 2px 0 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
  /* প্রতিষ্ঠানের logo + নাম + অ্যাপের নাম — সব পাতার উপরে */
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-logo {
    width: 46px; height: 46px; border-radius: 50%; object-fit: contain; flex: none; background: #fff; padding: 2px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 6px 14px rgba(15,10,60,.35);
  }
  .brand-txt { min-width: 0; }
  .brand-txt b { display: block; font-size: 17px; font-weight: 800; line-height: 1.2; letter-spacing: .01em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; }
  .brand-sub .app { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; opacity: .78; }
  /* কার To-Do — সোনালি pill */
  .owner {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 3px; border-radius: 999px;
    background: linear-gradient(135deg, #FDE68A, #F59E0B); color: #3B2304;
    font-size: 11.5px; font-weight: 800; letter-spacing: .01em; white-space: nowrap;
    box-shadow: 0 3px 10px -3px rgba(245,158,11,.7), inset 0 0 0 1px rgba(255,255,255,.45);
  }
  .owner i {
    width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
    background: rgba(59,35,4,.85); color: #FDE68A;
  }
  .hbtn {
    width: 36px; height: 36px; border-radius: 11px; border: 0; color: #fff;
    background: rgba(255,255,255,.14); display: grid; place-items: center; transition: transform .12s;
  }
  .hbtn:active { transform: scale(.92); }
  .hacts { display: flex; gap: 8px; flex: none; }
  /* 🔔 শুধু GitHub সাইটে (ntf.js থাকলে) দেখায় */
  html:not(.ntf-on) [data-ntf-bell] { display: none !important; }
  .hbtn.spin .ic { animation: spin .9s linear infinite; }
  .hero-date { margin-top: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; opacity: .95; }
  .pill-rel { background: rgba(255,255,255,.2); padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
  .hero-stats { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .ringwrap { position: relative; width: 60px; height: 60px; flex: none; }
  .ringwrap b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .ring circle { transition: stroke-dashoffset .5s ease; }
  .hs { display: flex; gap: 6px; flex: 1; }
  .hs div { flex: 1; background: rgba(255,255,255,.11); border-radius: 12px; padding: 7px 6px; text-align: center; }
  .hs b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .hs span { font-size: 10.5px; opacity: .8; }
  .hero-sub { margin-top: 12px; display: flex; flex-direction: column; }
  .hero-sub b { font-size: 17px; font-weight: 800; }
  .hero-sub span { font-size: 12.5px; opacity: .8; }
  .modes { display: flex; gap: 4px; margin-top: 14px; background: rgba(255,255,255,.1); padding: 4px; border-radius: 13px; }
  .modes button {
    flex: 1; border: 0; background: none; color: rgba(255,255,255,.82); padding: 7px 2px;
    border-radius: 10px; font-weight: 600; font-size: 12.5px; transition: background .15s, color .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .modes button.on { background: #fff; color: var(--hero-2); }
  .badge {
    display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 9px; background: #F43F5E; color: #fff; font-size: 10px; font-weight: 700; margin-left: 5px;
  }

  main { padding: 12px 14px 0; }

  /* ============ তারিখের স্ট্রিপ ============ */
  .strip {
    display: flex; align-items: center; gap: 6px; background: var(--surface);
    border-radius: var(--r); padding: 6px; box-shadow: var(--shadow); margin-bottom: 10px;
  }
  .days { flex: 1; display: flex; gap: 3px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: 0 0 44px; border: 0; background: none; border-radius: 12px; padding: 6px 0 5px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink-2);
    transition: background .15s;
  }
  .day .dw { font-size: 10.5px; font-weight: 600; }
  .day .dn { font-size: 16px; font-weight: 700; color: var(--ink); }
  .day .bar { width: 18px; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 3px; }
  .day .bar i { display: block; height: 100%; background: var(--ok); }
  .day .bar.none { background: transparent; }
  .day.off { opacity: .6; }
  .day.off .dw { color: var(--danger); }
  .day.today .dn { color: var(--brand); }
  .day.on { background: linear-gradient(160deg, var(--hero-2), var(--hero-3)); opacity: 1; }
  .day.on .dn, .day.on .dw { color: #fff; }
  .day.on .bar { background: rgba(255,255,255,.3); }
  .day.on .bar i { background: #fff; }
  .sbtn {
    flex: none; width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--surface-2);
    color: var(--ink-2); display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .sbtn.cal input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .wnav {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface);
    border-radius: var(--r); padding: 6px; box-shadow: var(--shadow); margin-bottom: 10px; font-size: 14px;
  }
  .info {
    display: flex; gap: 8px; align-items: flex-start; background: color-mix(in srgb, var(--warn) 10%, var(--surface));
    color: var(--ink-2); border-radius: var(--r); padding: 10px 12px; font-size: 12.5px; margin-bottom: 10px;
  }
  .info .ic { color: var(--warn); margin-top: 1px; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--r);
    padding: 0 12px; box-shadow: var(--shadow); margin-bottom: 10px; color: var(--ink-3);
    border: 1.5px solid transparent;
  }
  .search:focus-within { border-color: var(--brand); }
  .search input { flex: 1; border: 0; outline: 0; background: none; padding: 12px 0; font-size: 15px; color: var(--ink); min-width: 0; }

  /* ============ দ্রুত যোগ ============ */
  .quick {
    display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: var(--r);
    padding: 5px 5px 5px 12px; box-shadow: var(--shadow); margin-bottom: 10px;
    border: 1.5px solid transparent; transition: border-color .15s;
  }
  .quick:focus-within { border-color: var(--brand); }
  .quick .qi { color: var(--warn); }
  .quick input { flex: 1; border: 0; outline: 0; background: none; padding: 8px 0; font-size: 14.5px; min-width: 0; }
  .quick input::placeholder, .inp::placeholder { color: var(--ink-3); }
  .qbtn {
    width: 36px; height: 36px; border-radius: 10px; border: 0; display: grid; place-items: center;
    background: var(--surface-2); color: var(--ink-2); flex: none; transition: transform .12s, opacity .12s;
  }
  .qbtn:active { transform: scale(.92); }
  .qbtn:disabled { opacity: .5; }
  .qbtn.go { background: linear-gradient(135deg, var(--hero-2), var(--hero-3)); color: #fff; }

  /* ============ ফিল্টার ============ */
  .chips-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 4px; padding: 0 14px 6px; }
  .chips-row::-webkit-scrollbar { display: none; }
  .fchip {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .fchip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .fchip small { color: var(--ink-3); font-weight: 600; font-size: 11px; }
  .fchip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .fchip.on small { color: inherit; opacity: .65; }

  /* ============ সেকশন ============ */
  .sec {
    display: flex; align-items: center; gap: 8px; margin: 12px 2px 8px;
    font-size: 12px; font-weight: 700; color: var(--ink-2);
  }
  .sec .sub { font-weight: 500; color: var(--ink-3); }
  .sec .rule { flex: 1; height: 1px; background: var(--line); }
  .sec.tap { cursor: pointer; user-select: none; }
  .sec .act { color: var(--brand); }
  .sec .add {
    border: 0; background: var(--surface-2); color: var(--brand); width: 26px; height: 26px;
    border-radius: 8px; display: grid; place-items: center;
  }
  .sec .offtag { font-size: 10.5px; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); padding: 1px 7px; border-radius: 999px; }
  .none-day { font-size: 12px; color: var(--ink-3); padding: 2px 4px 4px; }

  /* ============ কাজের কার্ড ============ */
  .card {
    display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    border-radius: var(--r); padding: 11px 12px 11px 13px; box-shadow: var(--shadow);
    position: relative; overflow: hidden; margin-bottom: 8px; cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  .card:active { transform: scale(.99); }
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .card.stuck::before { background: repeating-linear-gradient(180deg, var(--danger) 0 6px, transparent 6px 10px); }
  .chk {
    width: 23px; height: 23px; border-radius: 50%; border: 2px solid var(--c); flex: none;
    display: grid; place-items: center; margin-top: 1px; background: transparent; color: #fff; padding: 0;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .chk:active { transform: scale(.85); }
  .card.done { opacity: .62; }
  .card.done .chk { background: var(--c); }
  .card.done .ttl { text-decoration: line-through; color: var(--ink-3); }
  .cbody { flex: 1; min-width: 0; }
  .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .ttl { font-weight: 600; font-size: 14.5px; line-height: 1.38; word-wrap: break-word; min-width: 0; }
  .tm {
    font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap;
    font-variant-numeric: tabular-nums; background: var(--surface-2); padding: 2px 7px; border-radius: 7px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .tag {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; line-height: 1.5;
    background: color-mix(in srgb, var(--t) 13%, transparent); color: var(--t);
    display: inline-flex; align-items: center; gap: 4px;
  }
  @media (prefers-color-scheme: dark) { .tag { color: color-mix(in srgb, var(--t) 60%, white); } }
  .tag.plain { background: var(--surface-2); color: var(--ink-2); }
  .note {
    font-size: 12.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .note::before { content: '✎ '; color: var(--ink-3); }
  .mini {
    flex: none; align-self: center; border: 0; border-radius: 9px; padding: 6px 8px 6px 10px;
    background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand);
    font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 2px;
  }

  .empty {
    text-align: center; padding: 30px 20px; background: var(--surface); border-radius: var(--r);
    box-shadow: var(--shadow); color: var(--ink-2); margin-bottom: 8px;
  }
  .empty .g { font-size: 30px; }

  /* ============ প্যানেল / রিপোর্ট ============ */

  /* নিরাপত্তা প্যানেল */

<div id="alLock" role="dialog" aria-modal="true">
<style>

  <div class="al-f" id="alFb"><label for="alB" id="alLb"></label><input class="al-in" id="alB" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="al-f" id="alFc"><label for="alC" id="alLc"></label><input class="al-in" id="alC" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>

<script>
(function () {
  var MODE = '', IDLE_MIN = 15, MINLEN = 4;
  // github.io-র সব রিপোজিটরি একই ব্রাউজার storage ভাগ করে — তাই key-তে "todo_"
  var IDLE = IDLE_MIN * 60000, KEY = 'todo_appLockLast';
  var root = document.documentElement, box = document.getElementById('alLock');
  function $(id) { return document.getElementById(id); }
  function bn(n) { return String(n).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); }

  // logo না এলে 🔒
  var logo = $('alLogo');
  var noLogo = function () { logo.style.display = 'none'; $('alIco').style.display = ''; };
  logo.addEventListener('error', noLogo);
  if (logo.complete && !logo.naturalWidth) noLogo();

  // loginWait — লগইন হয়নি; লগইন পাতা খোলা রাখি, লগইনের পর PIN চাই
  var mode = '', locked = true, busy = false, mem = 0, lastWrite = 0, loginWait = false;

  // শেষ কাজের সময় — একই অ্যাপের অন্য উইন্ডোর সাথেও ভাগ হয়
  function readLast() {
    var v = 0;
    try { v = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
    return Math.max(v, mem);
  }
  function writeLast(t) {
    mem = t; lastWrite = Date.now();
    try { localStorage.setItem(KEY, String(t)); } catch (e) {}
  }
  function stale() { return Date.now() - readLast() > IDLE; }

  var TEXT = {
    wait:   { sub: '⏳ একটু অপেক্ষা করুন...', a: 'Please Enter the Pin', btn: 'Enter', busy: '', sw: '' },
    unlock: { sub: '', a: 'Please Enter the Pin', btn: 'Enter', busy: 'Logging IN...', sw: '🔑 PIN change?' },
    setup:  { sub: 'নতুন PIN ঠিক করুন — এরপর থেকে এই অ্যাপ খুলতে এই PIN লাগবে। অন্তত ' + bn(MINLEN) + ' অক্ষর।',
              a: 'New PIN', b: 'Confirm PIN', btn: 'Set PIN', busy: '⏳ সেভ হচ্ছে...', sw: '' },
    change: { sub: 'আগে বর্তমান PIN দিন, তারপর নতুন PIN।',
              a: 'Current PIN', b: 'New PIN', c: 'Confirm new PIN', btn: 'Change PIN', busy: '⏳ যাচাই হচ্ছে...', sw: '← ফিরে যান' }
  };

  function setMode(m) {
    mode = m;
    var t = TEXT[m];
    $('alSub').textContent = t.sub; $('alBtn').textContent = t.btn;
    $('alBtn').disabled = m === 'wait';
    $('alLa').textContent = t.a; $('alLb').textContent = t.b || ''; $('alLc').textContent = t.c || '';
    $('alFb').style.display = t.b ? '' : 'none';
    $('alFc').style.display = t.c ? '' : 'none';
    $('alSwitch').textContent = t.sw; $('alSwitch').style.display = t.sw ? '' : 'none';
    $('alA').value = $('alB').value = $('alC').value = '';
    msg('');
    focusA();
  }
  function focusA() { setTimeout(function () { try { $('alA').focus(); } catch (e) {} }, 30); }
  function msg(s, ok) { var e = $('alErr'); e.textContent = s; e.className = 'al-err' + (ok ? ' ok' : ''); }

  function lock() {
    if (!AUTH) { waitForLogin(); return; }
    locked = true; loginWait = false;
    root.removeAttribute('data-al-open');
    if (document.activeElement && !box.contains(document.activeElement)) { try { document.activeElement.blur(); } catch (e) {} }
    if (MODE) { setMode(MODE); return; }
    // PIN আগে সেট করা আছে কি না — সার্ভার জানে
    setMode('wait');
    callServer('appLockMode', []).then(function (m) {
      MODE = m === 'setup' ? 'setup' : 'unlock';
      if (locked && mode === 'wait') setMode(MODE);
    }, function (err) {
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); waitForLogin(); return; }
      msg(err.message);
      $('alBtn').disabled = false; $('alBtn').textContent = '🔄 আবার চেষ্টা';
    });
  }
  function unlock() {
    locked = false; loginWait = false;
    writeLast(Date.now());
    $('alA').value = $('alB').value = $('alC').value = '';
    root.setAttribute('data-al-open', '');
  }
  // লগইন পাতা দেখাতে লক সরিয়ে রাখি — লগইন নিজেই পাহারাদার
  function waitForLogin() {
    locked = false; loginWait = true;
    root.setAttribute('data-al-open', '');
  }
  window.appLockWaitLogin = waitForLogin;
  window.appLockAfterLogin = function () { if (stale()) lock(); else unlock(); };

  function check() { if (!locked && !loginWait && stale()) lock(); }

  function activity() {
    if (locked || loginWait) return;
    if (stale()) { lock(); return; }
    var n = Date.now();
    mem = n;
    if (n - lastWrite > 15000) writeLast(n);
  }

  function run(fn, args, ok) {
    var btn = $('alBtn'), label = btn.textContent;
    busy = true; btn.disabled = true; btn.textContent = TEXT[mode].busy; msg('');
    var done = function () { busy = false; btn.disabled = false; btn.textContent = label; };
    callServer(fn, args).then(function () { done(); ok(); }, function (err) {
      done();
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); waitForLogin(); return; }
      msg(String(err.message).replace(/^(Exception|Error):\s*/, ''));
      try { $('alA').select(); } catch (e) {}
    });
  }

  $('alForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    if (mode === 'wait') { lock(); return; }   // "আবার চেষ্টা"
    var a = $('alA').value.trim(), b = $('alB').value.trim(), c = $('alC').value.trim();
    if (mode === 'unlock') {
      if (!a) { msg('PIN লিখুন।'); focusA(); return; }
      run('appLockUnlock', [a], unlock);
    } else if (mode === 'setup') {
      if (a.length < MINLEN) { msg('PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); focusA(); return; }
      if (a !== b) { msg('দুইবার একই PIN লিখুন।'); $('alB').focus(); return; }
      run('appLockSetup', [a], function () { MODE = 'unlock'; unlock(); });
    } else {
      if (!a) { msg('বর্তমান PIN লিখুন।'); focusA(); return; }
      if (b.length < MINLEN) { msg('নতুন PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); $('alB').focus(); return; }
      if (b !== c) { msg('নতুন PIN দুইবার একই লিখুন।'); $('alC').focus(); return; }
      run('appLockChange', [a, b], function () {
        msg('✅ PIN বদলানো হয়েছে।', true);
        setTimeout(unlock, 900);
      });
    }
  });
  $('alSwitch').addEventListener('click', function () { if (!busy) setMode(mode === 'change' ? 'unlock' : 'change'); });
  $('alEye').addEventListener('click', function () {
    var on = box.classList.toggle('al-show');
    this.textContent = on ? '🙈 Hide PIN' : '👁 Show PIN';
    focusA();
  });

  // লক থাকা অবস্থায় কীবোর্ড যেন পেছনের অ্যাপে না যায়
  ['keydown', 'keypress', 'keyup'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (locked && !box.contains(e.target)) {
        e.stopImmediatePropagation(); e.preventDefault();
        if (t === 'keydown') focusA();
      }
    }, true);
  });
  ['pointerdown', 'mousemove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(function (t) {
    document.addEventListener(t, activity, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', check);
  window.addEventListener('focus', check);
  window.addEventListener('pagehide', function () { if (!locked && mem) writeLast(mem); });
  setInterval(check, 15000);

  // শুরু: লগইন নেই → লগইন পাতা; শেষ কাজ IDLE-এর মধ্যে হলে সরাসরি খোলা; নইলে PIN
  if (!AUTH) waitForLogin();
  else if (!stale()) unlock();
  else lock();
})();
</script>

function ic(name, size) {
  const s = size || 18;
  return '<svg class="ic" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

const $ = function (sel, el) { return (el || document).querySelector(sel); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- তারিখ ('yyyy-mm-dd' স্ট্রিং, UTC-তে হিসাব — টাইমজোনের ঝামেলা নেই) ---------- */
function k2d(k) { const p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function d2k(d) { return d.toISOString().slice(0, 10); }
function addDays(k, n) { const d = k2d(k); d.setUTCDate(d.getUTCDate() + n); return d2k(d); }
function dow(k) { return k2d(k).getUTCDay(); }
function fmt(k, o) { return k2d(k).toLocaleDateString('bn-BD', Object.assign({ timeZone: 'UTC' }, o)); }
function longDate(k) { return fmt(k, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function shortDate(k) { return fmt(k, { day: 'numeric', month: 'short' }); }
function bnNum(n) { return String(n).replace(/\d/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); }
function dhakaToday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dhaka', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function todayKey() { return S.boot ? S.boot.today : dhakaToday(); }
function relLabel(k) {
  const t = todayKey();
  if (k === t) return 'আজ';
  if (k === addDays(t, 1)) return 'আগামীকাল';
  if (k === addDays(t, -1)) return 'গতকাল';
  return fmt(k, { weekday: 'long' });
}
function isOff(k) { return !!S.boot && (S.boot.offDays.indexOf(dow(k)) !== -1 || !!S.holidaySet[k]); }
function weekStartOf(k) { return addDays(k, -((dow(k) + 1) % 7)); }   // শনিবার
function pct(o) { return o && o.t ? Math.round(o.d / o.t * 100) : 0; }
function cc(c) { return CAT[c] || '#64748B'; }
function timeText(i) { return i.start ? (i.end ? i.start + '–' + i.end : i.start) : ''; }

/* ---------- অবস্থা ---------- */

};
const busy = {};
function anyBusy() { return Object.keys(busy).some(function (k) { return busy[k]; }); }
let F = null;   // খোলা কাজের ফর্ম
let T = null;   // খোলা রুটিনের ফর্ম

/* ---------- সার্ভার কল ----------
 * লগইন টোকেন (AUTH) আর callServer() <head>-এ। টোকেন সার্ভার নিজেই
 * api* ফাংশনের প্রথম প্যারামিটারে বসায়, তাই এখানে শুধু বাকি আর্গুমেন্ট। */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return callServer(fn, args).catch(function (err) {
    // সেশনের মেয়াদ শেষ বা বাতিল — লগইন পাতায় পাঠাই
    if (/AUTH_REQUIRED/.test(err.message) && S.boot) { setAuth(''); showLogin(); }
    throw err;
  });
}

function listParams() {
  if (S.mode === 'week')    return { mode: 'range', from: S.weekStart, to: addDays(S.weekStart, 6) };
  if (S.mode === 'overdue') return { mode: 'overdue' };
  if (S.mode === 'search')  return { mode: 'search', q: S.q };
  return { mode: 'day', date: S.date, stripFrom: S.stripStart, stripTo: addDays(S.stripStart, 13) };
}

function applyList(res) {
  S.items = res.items || [];
  if (S.mode === 'day') S.counts = res.counts || {};
  S.overdue = res.overdue || 0;
  S.loading = false; S.error = null; S.loadedAt = Date.now(); S.stale = false;

  // মাঝরাত পার হলে "আজ" বদলে যায়
  if (S.boot && res.today && res.today !== S.boot.today) {
    const wasToday = S.date === S.boot.today;
    S.boot.today = res.today;
    if (wasToday && S.mode === 'day') { S.date = res.today; S.stripStart = addDays(res.today, -3); loadList(); return; }
  }
  if (S.filter !== 'all' && S.filter !== 'must' &&
      !S.items.some(function (i) { return i.category === S.filter; })) S.filter = 'all';
  // বাছাই করা কাজগুলোর যেটা আর তালিকায় নেই, সেটা বাছাই থেকেও বাদ
  if (S.sel) {
    const have = {};
    S.items.forEach(function (i) { have[i.row] = true; });
    Object.keys(S.sel).forEach(function (r) { if (!have[r]) delete S.sel[r]; });
  }
  if (S.tab === 'tasks') { renderHero(); fillTasks(); }
}

async function loadList(silent) {
  const seq = ++S.seq, mut = S.mut;
  if (S.mode === 'search' && !S.q.trim()) {
    S.items = []; S.loading = false; S.error = null;
    if (S.tab === 'tasks') { renderHero(); fillTasks(); }
    return;
  }
  if (!silent) { S.loading = true; if (S.tab === 'tasks') { renderHero(); fillTasks(); } }
  try {
    const res = await api('apiList', listParams());
    if (seq !== S.seq) return;
    // তালিকা আনার মাঝে কোনো কাজে টিক/বদল হয়েছে — এই তালিকায় সেটা নেই। বসালে টিক উল্টে যেত
    // (আগের "একটা Done হয়, আরেকটা ফিরে আসে" সমস্যা)। তাই ফেলে দিয়ে একটু পরে আবার আনি।
    if (silent && (mut !== S.mut || anyBusy())) { scheduleReload(); return; }
    applyList(res);
    if (mut !== S.mut) scheduleReload();
  } catch (e) {
    if (seq !== S.seq) return;
    S.loading = false; S.error = e.message;
    if (S.tab === 'tasks') { renderHero(); fillTasks(); }
  }
}

let reloadTimer = null;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(function () {
    if (anyBusy()) return scheduleReload();
    loadList(true);
  }, 1500);
}

/* ---------- রেন্ডার ---------- */
function render() {
  if (S.login) return;   // লগইন পাতা খোলা থাকলে পেছনের কোনো লোড সেটা মুছে দেবে না
  renderHero(); renderNav(); renderView(); renderBulk();
}

function ring(p, size, stroke, onHero) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - p / 100), m = size / 2;
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" stroke="' + (onHero ? 'rgba(255,255,255,.2)' : 'var(--surface-3)') + '" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" stroke="' + (onHero ? '#fff' : 'var(--brand)') + '" stroke-width="' + stroke + '" ' +
    'stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + m + ' ' + m + ')"/></svg>';
}

function renderHero() {
  if (S.login) return;
  let body = '';
  if (S.tab === 'tasks') {
    const total = S.items.length;
    const done = S.items.filter(function (i) { return i.done; }).length;
    const p = total ? Math.round(done / total * 100) : 0;
    const n = function (v) { return S.loading ? '–' : v; };
    let label;
    if (S.mode === 'day') label = '<span class="pill-rel">' + esc(relLabel(S.date)) + '</span>' + esc(longDate(S.date));
    else if (S.mode === 'week') label = '<span class="pill-rel">সপ্তাহ</span>' + esc(shortDate(S.weekStart)) + ' – ' + esc(fmt(addDays(S.weekStart, 6), { day: 'numeric', month: 'long' }));
    else if (S.mode === 'overdue') label = '<span class="pill-rel">বকেয়া</span>আগের ৬০ দিনের অসমাপ্ত কাজ';
    else label = '<span class="pill-rel">খুঁজুন</span>সব কাজের মধ্যে';

    const modes = [['day', 'দিন'], ['week', 'সপ্তাহ'], ['overdue', 'বকেয়া'], ['search', 'খুঁজুন']];
    body =
      '<div class="hero-date">' + label + '</div>' +
      '<div class="hero-stats"><div class="ringwrap">' + ring(S.loading ? 0 : p, 60, 7, true) + '<b>' + n(p + '%') + '</b></div>' +
      '<div class="hs"><div><b>' + n(total) + '</b><span>মোট</span></div><div><b>' + n(done) + '</b><span>Done</span></div>' +
      '<div><b>' + n(total - done) + '</b><span>বাকি</span></div></div></div>' +
      '<div class="modes">' + modes.map(function (m) {
        return '<button class="' + (S.mode === m[0] ? 'on' : '') + '" data-act="mode" data-v="' + m[0] + '">' + m[1] +
          (m[0] === 'overdue' && S.overdue ? '<span class="badge">' + S.overdue + '</span>' : '') + '</button>';
      }).join('') + '</div>';
  } else {
    const t = {
      routine:  ['রুটিন', 'নিয়মিত কাজ — নিজে থেকেই তৈরি হয়'],
      insights: ['রিপোর্ট', 'অগ্রগতি, প্রবণতা আর রিপোর্ট পাঠানো'],
      more:     ['আরও', 'ছুটির দিন, সিঙ্ক ও টুলস']
    }[S.tab];
    body = '<div class="hero-sub"><b>' + t[0] + '</b><span>' + t[1] + '</span></div>';
  }
  $('#hero').innerHTML =
    '<div class="hero-top">' + brandHead() + '<div class="hacts">' +
    '<button class="hbtn" data-ntf-bell aria-label="নোটিফিকেশন">' + ic('bell') + '</button>' +
    '<button class="hbtn' + (S.refreshing ? ' spin' : '') + '" data-act="refresh" aria-label="রিফ্রেশ">' + ic('refresh') + '</button></div></div>' + body;
  renderSide();
}

/* কম্পিউটারে বাঁয়ের সাইডবার (ফোনে CSS দিয়ে লুকানো — সেখানে নিচের ট্যাব-বার) */
function renderSide() {
  const el = $('#side');
  if (!el) return;
  if (S.login) { el.innerHTML = ''; return; }
  const tabs = [['tasks', 'কাজ', 'list'], ['routine', 'রুটিন', 'repeat'], ['insights', 'রিপোর্ট', 'chart'], ['more', 'আরও', 'grid']];
  const modes = [['day', 'দিন', 'sun'], ['week', 'সপ্তাহ', 'calendar'], ['overdue', 'বকেয়া', 'alert'], ['search', 'খুঁজুন', 'search']];
  el.innerHTML =
    '<div class="s-brand">' +
      (ORG_LOGO ? '<img class="brand-logo" src="' + ORG_LOGO + '" alt="logo" onerror="this.remove()">' : '') +
      '<div><b>' + esc(ORG_NAME) + '</b><span>TO-DO LIST</span></div></div>' +
    '<div class="s-owner"><span class="owner"><i>' + ic('user', 11) + '</i>' + esc(OWNER_NAME) + '</span></div>' +
    '<button class="s-new" data-act="side-new">' + ic('plus', 18) + (S.tab === 'routine' ? 'নতুন রুটিন' : 'নতুন কাজ') + '</button>' +
    '<div class="s-lbl">মেনু</div>' +
    tabs.map(function (t) {
      let h = '<button class="s-it' + (S.tab === t[0] ? ' on' : '') + '" data-act="tab" data-v="' + t[0] + '">' + ic(t[2], 18) + t[1] + '</button>';
      if (t[0] === 'tasks') {
        h += '<div class="s-subs">' + modes.map(function (m) {
          return '<button class="s-sub' + (S.tab === 'tasks' && S.mode === m[0] ? ' on' : '') + '" data-act="side-mode" data-v="' + m[0] + '">' +
            ic(m[2], 15) + m[1] + (m[0] === 'overdue' && S.overdue ? '<span class="badge">' + S.overdue + '</span>' : '') + '</button>';
        }).join('') + '</div>';
      }
      return h;
    }).join('') +
    '<div class="s-foot">' + (S.boot && S.boot.user ? esc(S.boot.user.email) + '<br>' : '') + 'Smart To-Do · v9.1</div>';
}

// সব পাতার উপরে — logo, প্রতিষ্ঠানের নাম, অ্যাপের নাম আর কার To-Do (logo না এলে শুধু লেখা)
function brandHead() {
  return '<div class="brand">' +
    (ORG_LOGO ? '<img class="brand-logo" src="' + ORG_LOGO + '" alt="logo" onerror="this.remove()">' : '') +
    '<div class="brand-txt"><b>' + esc(ORG_NAME) + '</b>' +
    '<div class="brand-sub"><span class="app">TO-DO LIST</span>' +
    '<span class="owner"><i>' + ic('user', 11) + '</i>' + esc(OWNER_NAME) + '</span></div></div></div>';
}

function renderNav() {
  const tabs = [['tasks', 'কাজ', 'list'], ['routine', 'রুটিন', 'repeat'], ['insights', 'রিপোর্ট', 'chart'], ['more', 'আরও', 'grid']];
  $('#nav').innerHTML = tabs.map(function (t) {
    return '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-act="tab" data-v="' + t[0] + '"><span class="pip">' + ic(t[2], 20) + '</span>' + t[1] + '</button>';
  }).join('');
  const fab = $('#fab');
  fab.innerHTML = ic('plus', 26);
  fab.style.display = (S.tab === 'tasks' || S.tab === 'routine') ? '' : 'none';
}

function renderView() {
  const key = S.tab + '|' + (S.tab === 'tasks' ? S.mode : '');
  if (S.tab === 'tasks') {
    if (S.viewKey !== key) { S.viewKey = key; $('#view').innerHTML = tasksFrame(); }
    fillTasks();
  } else {
    S.viewKey = key;
    if (S.tab === 'routine') fillRoutine();
    else if (S.tab === 'insights') fillInsights();
    else fillMore();
  }
}

function skel(n) { let h = ''; for (let i = 0; i < n; i++) h += '<div class="sk"></div>'; return h; }

function emptyBox(glyph, t1, t2, extra) {
  return '<div class="empty"><div class="g">' + glyph + '</div><div class="t1">' + t1 + '</div>' +
         (t2 ? '<div class="t2">' + t2 + '</div>' : '') + (extra || '') + '</div>';
}

/* ---------- কাজের পাতা ---------- */
function tasksFrame() {
  const quick = S.mode === 'search' ? '' :
    '<div class="quick"><span class="qi">' + ic('zap', 16) + '</span>' +
    '<input id="quick" placeholder="kal 3pm Rokomari meeting" autocomplete="off" enterkeyhint="done">' +
    '<button class="qbtn" data-act="quick-form" aria-label="পূর্ণ ফর্ম">' + ic('sliders') + '</button>' +
    '<button class="qbtn go" data-act="quick-add" id="addBtn" aria-label="যোগ করুন">' + ic('plus') + '</button></div>';
  return '<div id="toolbar"></div>' + quick + '<div id="chips" class="chips-row"></div><div id="list"></div>';
}

function fillTasks() {
  if (S.login || S.tab !== 'tasks' || !$('#list')) return;
  fillToolbar(); fillChips(); fillList(); renderBulk();
}

function fillToolbar() {
  const tb = $('#toolbar');
  if (S.mode === 'day') {
    let days = '';
    for (let d = 0; d < 14; d++) {
      const k = addDays(S.stripStart, d), c = S.counts[k];
      const cls = 'day' + (k === S.date ? ' on' : '') + (k === todayKey() ? ' today' : '') + (isOff(k) ? ' off' : '');
      days += '<button class="' + cls + '" data-act="pick-day" data-k="' + k + '">' +
        '<span class="dw">' + BN_WEEK[dow(k)] + '</span><span class="dn">' + bnNum(+k.slice(8)) + '</span>' +
        '<span class="bar' + (c ? '' : ' none') + '"><i style="width:' + (c ? Math.round(c.d / c.t * 100) : 0) + '%"></i></span></button>';
    }
    tb.innerHTML = '<div class="strip"><button class="sbtn" data-act="strip-prev" aria-label="আগের সপ্তাহ">' + ic('chevL') + '</button>' +
      '<div class="days" id="days">' + days + '</div>' +
      '<button class="sbtn" data-act="strip-next" aria-label="পরের সপ্তাহ">' + ic('chevR') + '</button>' +
      '<label class="sbtn cal" aria-label="তারিখ বাছুন">' + ic('calendar') + '<input type="date" id="pickDate" value="' + S.date + '"></label></div>';
    const box = $('#days'), on = box.querySelector('.day.on');
    if (on) box.scrollLeft = on.offsetLeft - box.offsetLeft - box.clientWidth / 2 + on.clientWidth / 2;
  } else if (S.mode === 'week') {
    tb.innerHTML = '<div class="wnav"><button class="sbtn" data-act="week-prev" aria-label="আগের সপ্তাহ">' + ic('chevL') + '</button>' +
      '<b>' + esc(shortDate(S.weekStart)) + ' – ' + esc(shortDate(addDays(S.weekStart, 6))) + '</b>' +
      '<button class="sbtn" data-act="week-next" aria-label="পরের সপ্তাহ">' + ic('chevR') + '</button></div>';
  } else if (S.mode === 'overdue') {
    tb.innerHTML = '<div class="info">' + ic('alert', 16) + '<span>তারিখ পেরিয়ে যাওয়া অসমাপ্ত কাজ। "আজ" চাপলে কাজটা আজকের তালিকায় চলে আসবে।</span>' +
      (S.items.length > 1 && !S.sel ? '<button class="lbtn" data-act="overdue-today">সব আজকে আনুন</button>' : '') + '</div>';
  } else if (!$('#q')) {
    tb.innerHTML = '<div class="search">' + ic('search') +
      '<input id="q" type="search" placeholder="কাজ, নোট বা গেস্ট খুঁজুন…" value="' + esc(S.q) + '" autocomplete="off"></div>';
    setTimeout(function () { const q = $('#q'); if (q) q.focus(); }, 60);
  }
}

function fillChips() {
  const box = $('#chips');
  if (!S.items.length) { box.innerHTML = ''; return; }
  const byCat = {};
  S.items.forEach(function (i) { byCat[i.category] = (byCat[i.category] || 0) + 1; });
  const must = S.items.filter(function (i) { return i.priority === 'Must'; }).length;
  const chip = function (v, label, n, color) {
    return '<button class="fchip' + (S.filter === v ? ' on' : '') + '" data-act="filter" data-v="' + esc(v) + '"' +
      (color ? ' style="--c:' + color + '"' : '') + '>' + (color ? '<span class="dot"></span>' : '') +
      esc(label) + ' <small>' + n + '</small></button>';
  };
  let h = chip('all', 'সব', S.items.length);
  if (must) h += chip('must', '▲ Must', must, PRI.Must);
  (S.boot ? S.boot.categories : Object.keys(CAT)).forEach(function (c) {
    if (byCat[c]) h += chip(c, c, byCat[c], cc(c));
  });
  Object.keys(byCat).forEach(function (c) {
    if (S.boot && S.boot.categories.indexOf(c) === -1) h += chip(c, c, byCat[c], cc(c));
  });
  box.innerHTML = h;
}

function visibleItems() {
  return S.items.filter(function (i) {
    if (S.filter === 'all') return true;
    if (S.filter === 'must') return i.priority === 'Must';
    return i.category === S.filter;
  });
}

function fillList() {
  const box = $('#list');
  if (S.loading) { box.innerHTML = skel(4); return; }
  if (S.error) {
    box.innerHTML = emptyBox('⚠️', 'লোড ব্যর্থ', esc(S.error), '<button class="btn ghost sm" data-act="refresh">আবার চেষ্টা</button>');
    return;
  }

  if (S.mode === 'search') {
    if (!S.q.trim()) { box.innerHTML = emptyBox('🔎', 'খুঁজুন', 'কাজের নাম, নোট, গেস্ট বা ক্যাটাগরি লিখুন'); return; }
    const vis = visibleItems();
    box.innerHTML = vis.length ? listbar(bnNum(vis.length) + 'টা পাওয়া গেছে') + grouped(vis, {})
                               : emptyBox('🤷', 'কিছু পাওয়া যায়নি', '“' + esc(S.q) + '” দিয়ে কোনো কাজ নেই');
    return;
  }
  if (S.mode === 'overdue') {
    const vis = visibleItems();
    box.innerHTML = vis.length ? listbar(bnNum(vis.length) + 'টা বকেয়া') + grouped(vis, { move: true })
                               : emptyBox('✨', 'কোনো বকেয়া নেই', 'আগের সব কাজ হয় শেষ, নয়তো সামনে সরানো হয়েছে');
    return;
  }
  if (S.mode === 'week') {
    const vis = visibleItems();
    box.innerHTML = (vis.length ? listbar(bnNum(vis.length) + 'টা কাজ · ' + bnNum(vis.filter(function (i) { return !i.done; }).length) + 'টা বাকি') : '') + weekList();
    return;
  }

  // দিনের তালিকা
  if (!S.items.length) {
    box.innerHTML = emptyBox('🗒️', 'CHILL BOSS', esc(relLabel(S.date)) + ' এখনও কোন কাজ নেই');
    return;
  }
  const vis = visibleItems();
  if (!vis.length) { box.innerHTML = emptyBox('🧐', 'এই ফিল্টারে কিছু নেই', ''); return; }

  const pending = vis.filter(function (i) { return !i.done; });
  const done    = vis.filter(function (i) { return i.done; });
  let h = listbar(bnNum(vis.length) + 'টা কাজ · ' + bnNum(done.length) + 'টা সম্পন্ন');
  if (pending.length) {
    h += '<div class="sec"><span>বাকি ' + bnNum(pending.length) + '</span><span class="rule"></span>' +
         (pending.length > 1 && !S.sel ? '<button class="sbtn2" data-act="all-done">' + ic('check', 12) + 'সব Done</button>' : '') + '</div>' +
         pending.map(function (i) { return card(i, {}); }).join('');
  } else {
    h += emptyBox('🎉', 'CONGRATULATIONS', 'সব কাজ সম্পন্ন হয়েছে');
  }
  if (done.length) {
    h += '<div class="sec tap" data-act="done-sec"><span>সম্পন্ন ' + bnNum(done.length) + '</span><span class="rule"></span>' +
         '<span class="act">' + (S.doneOpen ? 'Hide' : 'Show') + '</span></div>';
    if (S.doneOpen) h += done.map(function (i) { return card(i, {}); }).join('');
  }
  box.innerHTML = h;
}

// তালিকার উপরের সারি — সারসংক্ষেপ আর "নির্বাচন" (একসাথে অনেক কাজ Done/Status/সরানো/মোছা)
function listbar(txt) {
  return '<div class="listbar"><span class="lb-t">' + (S.sel ? 'কাজে চাপ দিয়ে বাছুন' : txt) + '</span>' +
    '<button class="lbtn' + (S.sel ? ' on' : '') + '" data-act="sel-mode">' + ic(S.sel ? 'x' : 'checksq', 14) +
    (S.sel ? 'নির্বাচন বন্ধ' : 'নির্বাচন') + '</button></div>';
}

// এই মুহূর্তে পর্দায় যে কাজগুলো দেখা যাচ্ছে ("সব বাছুন" এগুলোই বাছে — লুকানো সম্পন্নগুলো নয়)
function onScreenItems() {
  const vis = visibleItems();
  if (S.mode === 'day' && !S.doneOpen) return vis.filter(function (i) { return !i.done; });
  return vis;
}
function selectedItems() {
  return S.sel ? S.items.filter(function (i) { return S.sel[i.row]; }) : [];
}

function grouped(items, opts) {
  const groups = [];
  let cur = null;
  items.forEach(function (i) {
    if (!cur || cur.k !== i.date) { cur = { k: i.date, items: [] }; groups.push(cur); }
    cur.items.push(i);
  });
  return groups.map(function (g) {
    const left = g.items.filter(function (i) { return !i.done; }).length;
    return '<div class="sec"><span>' + esc(relLabel(g.k)) + '</span><span class="sub">' + esc(shortDate(g.k)) + '</span>' +
      '<span class="rule"></span><span class="sub">' + left + '/' + g.items.length + '</span></div>' +
      g.items.map(function (i) { return card(i, opts); }).join('');
  }).join('');
}

function weekList() {
  const vis = visibleItems();
  let h = '';
  for (let d = 0; d < 7; d++) {
    const k = addDays(S.weekStart, d);
    const its = vis.filter(function (i) { return i.date === k; });
    const left = its.filter(function (i) { return !i.done; }).length;
    h += '<div class="sec"><span>' + esc(relLabel(k)) + '</span><span class="sub">' + esc(shortDate(k)) + '</span>' +
      (isOff(k) ? '<span class="offtag">ছুটি</span>' : '') + '<span class="rule"></span>' +
      (its.length ? '<span class="sub">' + left + '/' + its.length + '</span>' : '') +
      '<button class="add" data-act="add-on" data-k="' + k + '" aria-label="এই দিনে কাজ যোগ">' + ic('plus', 15) + '</button></div>';
    h += its.length ? its.map(function (i) { return card(i, {}); }).join('') : '<div class="none-day">কোনো কাজ নেই</div>';
  }
  return h;
}

function card(i, opts) {
  const c = cc(i.category);
  const stuck = !i.done && S.boot && i.rollover >= S.boot.nudge;
  const time = timeText(i);
  let tags = '<span class="tag" style="--t:' + c + '">' + esc(i.category) + '</span>';
  if (i.priority === 'Must') tags += '<span class="tag" style="--t:' + PRI.Must + '">▲ Must</span>';
  else if (i.priority === 'Could') tags += '<span class="tag" style="--t:' + PRI.Could + '">▽ Could</span>';
  if (i.status && i.status !== 'To Do' && i.status !== 'Done') {
    tags += '<span class="tag" style="--t:' + (STA[i.status] || '#64748B') + '">' + esc(i.status) + '</span>';
  }
  if (i.rollover > 0 && !i.done) {
    tags += '<span class="tag" style="--t:' + (stuck ? 'var(--danger)' : '#64748B') + '">' + ic('flag', 11) + i.rollover + '×</span>';
  }
  if (i.guest) {
    const g = i.guest.split(',');
    tags += '<span class="tag plain">' + ic('user', 11) + esc(g[0].trim()) + (g.length > 1 ? ' +' + (g.length - 1) : '') + '</span>';
  }
  if (i.onCalendar) tags += '<span class="tag plain">' + ic('calendar', 11) + '</span>';
  if (i.source && !(i.source in SRC)) tags += '<span class="tag plain">' + ic('repeat', 11) + '</span>';

  // নির্বাচন মোডে কার্ডে চাপ = বাছা/ছাড়া; বাঁয়ে গোল টিকের বদলে চৌকো বাক্স
  const picking = !!S.sel, picked = picking && !!S.sel[i.row];
  const lead = picking
    ? '<span class="pick">' + (picked ? ic('check', 13) : '') + '</span>'
    : '<button class="chk" data-act="toggle" data-row="' + i.row + '" aria-label="' + (i.done ? 'আবার শুরু' : 'সম্পন্ন') + '">' + (i.done ? ic('check', 13) : '') + '</button>';
  return '<article class="card' + (i.done ? ' done' : '') + (stuck ? ' stuck' : '') + (picked ? ' sel' : '') + (busy[i.row] ? ' busy' : '') +
    '" style="--c:' + c + '" data-act="' + (picking ? 'pick' : 'edit') + '" data-row="' + i.row + '">' +
    lead +
    '<div class="cbody"><div class="row1"><div class="ttl">' + esc(i.task) + '</div>' +
    (time ? '<div class="tm">' + time + '</div>' : '') + '</div>' +
    '<div class="tags">' + tags + '</div>' +
    (i.note ? '<div class="note">' + esc(i.note) + '</div>' : '') + '</div>' +
    (opts.move && !picking ? '<button class="mini" data-act="move" data-row="' + i.row + '">আজ' + ic('chevR', 14) + '</button>' : '') +
    '</article>';
}

/* ---------- কাজের ফর্ম ---------- */
function findItem(row) {
  row = Number(row);
  const pools = [S.items];
  if (S.insights) pools.push(S.insights.stuck, S.insights.upcoming);
  for (let p = 0; p < pools.length; p++) {
    const hit = (pools[p] || []).filter(function (x) { return x.row === row; })[0];
    if (hit) return hit;
  }
  return null;
}
function refOf(i) { return { row: i.row, task: i.task, date: i.date }; }

function openEditor(item, preset) {
  if (item) {
    F = Object.assign({}, item, { ref: refOf(item) });
  } else {
    F = Object.assign({
      ref: null, task: '', category: 'Task', priority: 'Should', status: 'To Do',
      date: S.mode === 'day' ? S.date : todayKey(), start: '', end: '', note: '', guest: ''
    }, preset || {});
  }
  renderEditor();
  openSheet();
  if (!item) setTimeout(function () { const t = $('#fTask'); if (t) t.focus(); }, 280);
}

function guestHint(cat) {
  return S.boot.calendarCategories.indexOf(cat) !== -1
    ? '📅 Google Calendar-এ যাবে — গেস্টরা ইনভাইট পাবেন'
    : 'গেস্ট ইনভাইট শুধু ' + S.boot.calendarCategories.join(' / ') + '-এ যায়';
}

function renderEditor() {
  const isNew = !F.ref;
  const t = todayKey(), tm = addDays(t, 1), nw = S.boot.nextWorking;
  const quick = [[t, 'আজ'], [tm, 'আগামীকাল']];
  if (nw !== tm) quick.push([nw, 'পরের কর্মদিবস']);

  let meta = '';
  if (!isNew) {
    const bits = ['উৎস: ' + (F.source in SRC ? SRC[F.source] : 'রুটিন')];
    if (F.rollover) bits.push(F.rollover + ' বার পিছিয়েছে');
    if (F.onCalendar) bits.push('📅 ক্যালেন্ডারে আছে');
    meta = '<div class="meta">' + bits.map(function (b) { return '<span>' + esc(b) + '</span>'; }).join('') + '</div>';
  }

  $('#sheet').innerHTML =
    '<div class="grab"></div>' +
    '<div class="sh-head"><h2>' + (isNew ? 'নতুন কাজ' : 'কাজ এডিট') + '</h2>' +
    '<button class="x" data-act="close" aria-label="বন্ধ">' + ic('x') + '</button></div>' +
    '<textarea id="fTask" class="inp ttl-inp" rows="2" placeholder="কী করতে হবে?">' + esc(F.task) + '</textarea>' +
    '<div class="fld"><div class="lbl">ক্যাটাগরি</div><div class="chips">' +
      S.boot.categories.map(function (c) {
        return '<button class="chip' + (F.category === c ? ' on' : '') + '" style="--c:' + cc(c) + '" data-act="f-cat" data-v="' + esc(c) + '"><span class="dot"></span>' + esc(c) + '</button>';
      }).join('') + '</div></div>' +
    '<div class="fld"><div class="lbl">প্রায়োরিটি</div><div class="seg">' +
      S.boot.priorities.map(function (p) {
        return '<button class="' + (F.priority === p ? 'on' : '') + '" style="--c:' + PRI[p] + '" data-act="f-pri" data-v="' + p + '">' + p + '</button>';
      }).join('') + '</div></div>' +
    '<div class="fld"><div class="lbl">তারিখ</div><div class="daterow">' +
      '<input type="date" id="fDate" class="inp" value="' + F.date + '">' +
      quick.map(function (q) {
        return '<button class="chip sm' + (F.date === q[0] ? ' on' : '') + '" data-act="f-date" data-v="' + q[0] + '">' + q[1] + '</button>';
      }).join('') + '</div></div>' +
    '<div class="fld"><div class="lbl">সময় <span class="hint">(ঐচ্ছিক)</span></div><div class="timerow">' +
      '<div class="tin"><input type="time" id="fStart" class="inp" value="' + F.start + '"><button class="clr" data-act="f-clear" data-v="fStart" aria-label="মুছুন">' + ic('x', 13) + '</button></div>' +
      '<span class="dash">থেকে</span>' +
      '<div class="tin"><input type="time" id="fEnd" class="inp" value="' + F.end + '"><button class="clr" data-act="f-clear" data-v="fEnd" aria-label="মুছুন">' + ic('x', 13) + '</button></div>' +
    '</div></div>' +
    '<div class="fld"><div class="lbl">স্ট্যাটাস</div><div class="chips">' +
      S.boot.statuses.map(function (s) {
        return '<button class="chip sm' + (F.status === s ? ' on' : '') + '" style="--c:' + (STA[s] || '#64748B') + '" data-act="f-sta" data-v="' + esc(s) + '">' + esc(s) + '</button>';
      }).join('') + '</div></div>' +
    '<div class="fld"><div class="lbl">নোট</div><textarea id="fNote" class="inp" rows="2" placeholder="নোট (কেন Pending/Processing — ঐচ্ছিক)">' + esc(F.note) + '</textarea></div>' +
    '<div class="fld"><div class="lbl">গেস্ট ইমেইল</div>' +
      '<input id="fGuest" class="inp" type="text" inputmode="email" autocomplete="off" placeholder="name@gmail.com, …" value="' + esc(F.guest) + '">' +
      '<div class="hint" id="gHint">' + guestHint(F.category) + '</div></div>' +
    meta +
    '<div class="ferr" id="fErr"></div>' +
    '<div class="sh-act">' +
      (isNew ? '' :
        '<button class="btn danger icon" data-act="f-del" aria-label="মুছুন">' + ic('trash') + '</button>' +
        '<button class="btn ghost icon" data-act="f-copy" aria-label="কপি করে নতুন">' + ic('copy') + '</button>') +
      '<button class="btn primary grow" data-act="f-save" id="fSave">' + (isNew ? 'যোগ করুন' : 'সেভ করুন') + '</button>' +
    '</div>';
}

function readForm() {
  F.task = $('#fTask').value; F.date = $('#fDate').value || todayKey();
  F.start = $('#fStart').value; F.end = $('#fEnd').value;
  F.note = $('#fNote').value; F.guest = $('#fGuest').value;
}

function pickIn(el, attrAct) {
  el.parentNode.querySelectorAll('[data-act="' + attrAct + '"]').forEach(function (b) { b.classList.toggle('on', b === el); });
}

function formError(msg) {
  const e = $('#fErr');
  if (!e) return toast(msg);
  e.textContent = msg; e.classList.toggle('show', !!msg);
}

async function saveTask(btn) {
  readForm();
  if (!F.task.trim()) return formError('কাজের নাম লিখুন।');
  btn.classList.add('loading'); formError('');
  try {
    const it = await api('apiSaveTask', {
      ref: F.ref, task: F.task, category: F.category, priority: F.priority, status: F.status,
      date: F.date, start: F.start, end: F.end, note: F.note, guest: F.guest
    });
    const wasNew = !F.ref;
    closeSheet();
    const where = (S.mode === 'day' && it.date !== S.date) ? ' — ' + relLabel(it.date) + ', ' + shortDate(it.date) : '';
    toast((wasNew ? 'এন্ট্রি যোগ হয়েছে' : 'সেভ হয়েছে ✓') + where);
    S.insights = null;
    loadList(true);
  } catch (e) {
    btn.classList.remove('loading');
    formError(e.message);
  }
}

async function deleteTask() {
  const ok = await ask('কাজটা মুছবেন?', '“' + F.task + '” স্থায়ীভাবে মুছে যাবে। Calendar event থাকলে সেটাও মুছবে।', { ok: 'মুছে ফেলুন', danger: true });
  if (!ok) return;
  const ref = F.ref;
  closeSheet();
  deleteItems([findItem(ref.row) || { row: ref.row, task: ref.task, date: ref.date }], true);
}

/* ---------- টিক, সরানো, মোছা — একটা হোক বা অনেকগুলো, সব এখান দিয়ে ----------
 * পর্দায় সাথে সাথে বদলায়, সার্ভারে পাঠায়, সার্ভারের উত্তর বসায়; ব্যর্থ হলে আগের অবস্থায় ফেরে।
 * চলাকালীন S.mut বদলায়, তাই মাঝে আসা পুরনো তালিকা টিক উল্টে দিতে পারে না (loadList দেখুন)। */
function isDoneStatus(s) { return /^(done|complete|completed|সম্পন্ন|শেষ)$/i.test(String(s || '').trim()); }

// সরানোর পর এই তালিকাতেই থাকবে কি না
function staysAfterMove(date) {
  if (S.mode === 'day') return date === S.date;
  if (S.mode === 'week') return date >= S.weekStart && date <= addDays(S.weekStart, 6);
  if (S.mode === 'overdue') return date < todayKey();
  return true;
}

// পর্দার গোনা (তারিখের স্ট্রিপ, বকেয়ার সংখ্যা) — তালিকা থেকে নতুন করে
function recountLocal() {
  if (S.mode === 'day') {
    if (S.items.length) S.counts[S.date] = { t: S.items.length, d: S.items.filter(function (i) { return i.done; }).length };
    else delete S.counts[S.date];
  }
  if (S.mode === 'overdue') S.overdue = S.items.filter(function (i) { return !i.done; }).length;
}

function refreshAfterLocalChange() {
  recountLocal();
  if (S.tab === 'tasks') { renderHero(); fillTasks(); }
  else if (S.tab === 'insights' && S.insights) fillInsights();
}

// একবারে সার্ভারে কতগুলো কাজ যায় (সার্ভারের সীমা BULK_MAX = 400)
const BULK_CHUNK = 150;

async function patchItems(list, patch, msg) {
  list = list.filter(function (i) { return i && !busy[i.row]; });
  if (!list.length) return false;
  S.mut++;
  const prev = list.map(function (i) { return Object.assign({}, i); });
  const refs = prev.map(refOf);
  const gone = [];
  list.forEach(function (i) {
    busy[i.row] = true;
    if (patch.status !== undefined) { i.status = patch.status; i.done = isDoneStatus(patch.status); }
    if (patch.priority !== undefined) i.priority = patch.priority;
    if (patch.date !== undefined) { i.date = patch.date; if (!staysAfterMove(patch.date)) gone.push(i); }
  });
  if (gone.length) S.items = S.items.filter(function (x) { return gone.indexOf(x) === -1; });
  refreshAfterLocalChange();
  // একটা কাজ হলে সাথে সাথে বার্তা; অনেকগুলো হলে "হয়েছে" বলা হয় সার্ভার নিশ্চিত করার পরেই
  // (⚠️ FIX v9.1: আগে আগেভাগেই "৯৪০টা Done" দেখাত, অথচ সার্ভারে সব হতো না)
  if (msg && list.length === 1) toast(msg);
  else if (list.length > 1) toast('⏳ ' + bnNum(list.length) + 'টা কাজ আপডেট হচ্ছে…', true);

  let ok = true, doneN = 0, failN = 0, err = null;
  // অনেক কাজ হলে BULK_CHUNK করে ভাগে ভাগে — প্রতিটা কল সময়ের মধ্যে শেষ হয়
  for (let s = 0; s < list.length; s += BULK_CHUNK) {
    const e2 = Math.min(s + BULK_CHUNK, list.length);
    try {
      let res;
      if (list.length === 1) {
        const it = await api('apiPatchTask', refs[0], patch);
        it.was = refs[0].row;
        res = { items: [it], failed: [] };
      } else {
        res = await api('apiBulkPatch', refs.slice(s, e2), patch);
      }
      const byWas = {};
      res.items.forEach(function (it) { byWas[it.was] = it; delete it.was; });
      for (let n = s; n < e2; n++) { const it = byWas[prev[n].row]; if (it) Object.assign(list[n], it); }
      doneN += res.items.length; failN += res.failed.length;
      if (e2 < list.length) toast('⏳ ' + bnNum(e2) + '/' + bnNum(list.length) + 'টা হয়েছে…', true);
    } catch (e) {
      err = e;
      // এই ভাগ আর পরের ভাগগুলো হয়নি — পর্দায় আগের অবস্থায় ফেরত
      for (let n = s; n < list.length; n++) Object.assign(list[n], prev[n]);
      const back = gone.filter(function (g) { return list.indexOf(g) >= s; });
      if (back.length) S.items = S.items.concat(back);
      break;
    }
  }
  if (err) {
    ok = false;
    toast(doneN ? bnNum(doneN) + 'টা হয়েছে, বাকি ' + bnNum(list.length - doneN) + 'টা হয়নি — ' + err.message
                : 'ব্যর্থ: ' + err.message);
  } else if (failN) {
    ok = false;
    toast(bnNum(doneN) + 'টা হয়েছে · ' + bnNum(failN) + 'টা কাজ খুঁজে পাওয়া যায়নি — তালিকা নতুন করে আনা হচ্ছে');
  } else if (list.length > 1 && msg) {
    toast(msg);
  }
  prev.forEach(function (p) { busy[p.row] = false; });
  S.mut++;
  S.insights = null;
  refreshAfterLocalChange();
  scheduleReload();
  return ok;
}

// মোছার পর শিটের নিচের রোগুলো উপরে ওঠে — পর্দার রো নম্বরও সেভাবে ঠিক করি
function shiftRows(deleted) {
  const d = (deleted || []).map(Number);
  S.items.forEach(function (i) {
    i.row -= d.filter(function (r) { return r < i.row; }).length;
  });
}

async function deleteItems(list, asked) {
  list = list.filter(function (i) { return i && !busy[i.row]; });
  if (!list.length) return false;
  if (!asked) {
    const n = list.length;
    const ok = await ask(n === 1 ? 'কাজটা মুছবেন?' : bnNum(n) + 'টা কাজ মুছবেন?',
      (n === 1 ? '“' + list[0].task + '”' : 'বাছাই করা ' + bnNum(n) + 'টা কাজ') + ' স্থায়ীভাবে মুছে যাবে। Calendar event থাকলে সেটাও মুছবে।',
      { ok: 'মুছে ফেলুন', danger: true });
    if (!ok) return false;
  }
  S.mut++;
  const refs = list.map(refOf);
  const busyRows = refs.map(function (r) { return r.row; });
  busyRows.forEach(function (r) { busy[r] = true; });
  const before = S.items.slice();
  S.items = S.items.filter(function (x) { return list.indexOf(x) === -1; });
  refreshAfterLocalChange();

  let ok = true, delN = 0, failN = 0;
  if (refs.length > 1) toast('⏳ ' + bnNum(refs.length) + 'টা কাজ মোছা হচ্ছে…', true);
  // অনেক হলে ভাগে ভাগে (BULK_CHUNK) — প্রতিটা ভাগের পর রো নম্বর ঠিক করে পরের ভাগ
  for (let s = 0; s < refs.length; s += BULK_CHUNK) {
    const part = refs.slice(s, s + BULK_CHUNK);
    try {
      let res;
      if (refs.length === 1) { await api('apiDeleteTask', refs[0]); res = { deleted: [refs[0].row], failed: [] }; }
      else res = await api('apiBulkDelete', part);
      shiftRows(res.deleted);
      // পরের ভাগের রো নম্বরও সরে গেছে — একই হিসাবে ঠিক করা
      const d = (res.deleted || []).map(Number);
      refs.slice(s + BULK_CHUNK).forEach(function (r) { r.row -= d.filter(function (x) { return x < r.row; }).length; });
      delN += res.deleted.length; failN += res.failed.length;
    } catch (e) {
      ok = false;
      if (!delN) S.items = before;   // কিছুই মোছেনি — সব ফেরত; কিছু মুছে থাকলে পরের রিলোড ঠিক করবে
      toast(delN ? bnNum(delN) + 'টা মুছেছে, বাকিগুলো হয়নি — ' + e.message : 'ব্যর্থ: ' + e.message);
      break;
    }
  }
  if (ok) toast(failN ? bnNum(delN) + 'টা মুছেছে, ' + bnNum(failN) + 'টা খুঁজে পাওয়া যায়নি'
                      : (refs.length === 1 ? 'মুছে ফেলা হয়েছে' : bnNum(delN) + 'টা কাজ মুছে ফেলা হয়েছে'));
  busyRows.forEach(function (r) { busy[r] = false; });
  S.mut++;
  S.insights = null;
  refreshAfterLocalChange();
  scheduleReload();
  return ok;
}

function toggle(row) {
  const i = findItem(row);
  if (!i || busy[i.row]) return;
  const next = i.done ? (S.boot.statuses[0] || 'To Do') : 'Done';
  patchItems([i], { status: next }, next === 'Done' ? 'সম্পন্ন ✓' : 'আবার শুরুতে ফেরানো হলো');
}

function moveToToday(row) {
  const i = findItem(row);
  if (!i || busy[i.row]) return;
  patchItems([i], { date: todayKey() }, 'আজকের তালিকায় আনা হয়েছে');
}

/* ---------- নির্বাচন: একসাথে অনেক কাজ ---------- */
function startSelect(row) {
  S.sel = {};
  if (row) S.sel[row] = true;
  fillTasks();
}
function stopSelect() {
  if (!S.sel) return;
  S.sel = null;
  if (S.tab === 'tasks') fillTasks(); else renderBulk();
}
function pickRow(row) {
  if (!S.sel) return;
  if (S.sel[row]) delete S.sel[row]; else S.sel[row] = true;
  fillList(); renderBulk();
}
function pickAll() {
  const vis = onScreenItems();
  const all = vis.length && vis.every(function (i) { return S.sel[i.row]; });
  S.sel = {};
  if (!all) vis.forEach(function (i) { S.sel[i.row] = true; });
  fillList(); renderBulk();
}

function renderBulk() {
  const on = !!S.sel && S.tab === 'tasks' && !S.login;
  document.body.classList.toggle('selecting', on);
  const b = $('#bulk');
  if (!b) return;
  if (!on) { b.innerHTML = ''; return; }
  const n = Object.keys(S.sel).length, vis = onScreenItems();
  const all = vis.length && vis.every(function (i) { return S.sel[i.row]; });
  const btn = function (act, icon, label, cls) {
    return '<button class="' + (cls || '') + '" data-act="' + act + '"' + (n ? '' : ' disabled') + '>' + ic(icon, 18) + label + '</button>';
  };
  b.innerHTML =
    '<div class="bulk-top"><span class="grow">' + (n ? bnNum(n) + 'টা কাজ বাছাই' : 'কাজে চাপ দিয়ে বাছুন') + '</span>' +
      '<button data-act="sel-all">' + (all ? 'সব ছাড়ুন' : 'সব বাছুন') + '</button>' +
      '<button data-act="sel-exit" aria-label="বন্ধ">' + ic('x', 14) + '</button></div>' +
    '<div class="bulk-acts">' +
      btn('bulk-done', 'check', 'Done', 'ok') + btn('bulk-todo', 'undo', 'To Do') + btn('bulk-status', 'tag', 'Status') +
      btn('bulk-date', 'calendar', 'সরান') + btn('bulk-del', 'trash', 'মুছুন', 'del') +
    '</div>';
}

async function bulkPatch(patch, msg) {
  const list = selectedItems();
  if (!list.length) return;
  closeSheet();
  stopSelect();
  await patchItems(list, patch, msg.replace('%n', bnNum(list.length)));
}

// Status / তারিখ বাছার ছোট তালিকা (নিচের শিটে)
function openChooser(kind) {
  const n = selectedItems().length;
  if (!n) return;
  let body;
  if (kind === 'status') {
    body = S.boot.statuses.map(function (s) {
      return '<button class="opt" style="--c:' + (STA[s] || '#64748B') + '" data-act="opt-status" data-v="' + esc(s) + '"><span class="dot"></span>' + esc(s) + '</button>';
    }).join('');
  } else {
    const t = todayKey(), tm = addDays(t, 1), nw = S.boot.nextWorking;
    const dates = [[t, 'আজ'], [tm, 'আগামীকাল']];
    if (nw !== tm) dates.push([nw, 'পরের কর্মদিবস']);
    body = dates.map(function (d) {
      return '<button class="opt" style="--c:var(--brand)" data-act="opt-date" data-v="' + d[0] + '"><span class="dot"></span>' + d[1] + '<small>' + esc(shortDate(d[0])) + '</small></button>';
    }).join('') +
    '<div class="fld"><div class="lbl">অন্য তারিখ</div><div class="prow"><input type="date" id="optDate" class="inp" value="' + addDays(t, 2) + '">' +
    '<button class="btn primary" data-act="opt-date-go">সরান</button></div></div>';

    '<button class="x" data-act="close" aria-label="বন্ধ">' + ic('x') + '</button></div>' + body;

async function quickAdd() {
  const el = $('#quick'), btn = $('#addBtn');
  const text = el.value.trim();

  btn.disabled = true;
  try {
    const it = await api('apiQuickAdd', text);

    const where = it.date !== S.date ? ' — ' + relLabel(it.date) + ', ' + shortDate(it.date) : '';
    toast('এন্ট্রি যোগ হয়েছে' + where + (it.start ? ' · ' + it.start : ''));
    S.insights = null;
    loadList(true);
  } catch (e) { toast('ব্যর্থ: ' + e.message); }

/* লেখা থাকলে সেটা বুঝে ফর্ম আগেই ভরে দিই */
async function quickForm() {
  const el = $('#quick'), text = el ? el.value.trim() : '';
  if (!text) return openEditor(null);
  try {
    const p = await api('apiParse', text);
    el.value = '';

/* ---------- রুটিন ---------- */
function tplWeekdays(days) {
  return String(days || '').split(',').map(function (s) { return s.trim().toLowerCase(); })
    .map(function (s) { return WEEK_EN.filter(function (w) { return w.toLowerCase() === s; })[0]; })
    .filter(Boolean);
}

function tplSummary(t) {
  if (t.repeat === 'Weekly') {
    const w = tplWeekdays(t.days);
    return 'প্রতি সপ্তাহ · ' + (SAT_FIRST.filter(function (d) { return w.indexOf(WEEK_EN[d]) !== -1; })
      .map(function (d) { return BN_WEEK[d]; }).join(', ') || '—');
  }
  if (t.repeat === 'Monthly') return 'প্রতি মাসের ' + bnNum(t.days || 1) + ' তারিখ';
  return 'প্রতি কর্মদিবস';
}

async function loadTemplates() {
  if (S.loadingTpl) return;
  S.loadingTpl = true;
  try { S.templates = await api('apiTemplates'); }
  catch (e) { S.templates = null; toast('লোড ব্যর্থ: ' + e.message); }
  S.loadingTpl = false;
  if (S.tab === 'routine' && S.templates) fillRoutine();
}

function fillRoutine() {
  const v = $('#view');
  if (!S.templates) { v.innerHTML = skel(4); loadTemplates(); return; }
  const on = S.templates.filter(function (t) { return t.active; }).length;
  let h = '<div class="rhead"><div><b>' + S.templates.length + '</b> রুটিন · ' + on + ' চালু</div>' +
    '<button class="btn ghost sm" data-act="tool" data-tool="recurring">' + ic('zap', 15) + ' এখনই তৈরি করো</button></div>';
  if (!S.templates.length) {
    h += emptyBox('🔁', 'কোনো রুটিন নেই', 'নিচের + দিয়ে প্রতিদিন, সাপ্তাহিক বা মাসিক কাজ যোগ করুন — প্রতি রাতে নিজে থেকেই তৈরি হবে');
  } else {
    h += S.templates.map(function (t) {
      const time = t.start ? (t.end ? t.start + '–' + t.end : t.start) : '';
      return '<article class="card' + (t.active ? '' : ' done') + '" style="--c:' + cc(t.category) + '" data-act="tpl-edit" data-id="' + esc(t.id) + '">' +
        '<div class="cbody"><div class="row1"><div class="ttl" style="text-decoration:none">' + esc(t.task) + '</div>' +
        (time ? '<div class="tm">' + time + '</div>' : '') + '</div>' +
        '<div class="tags"><span class="tag" style="--t:#7C3AED">' + ic('repeat', 11) + esc(tplSummary(t)) + '</span>' +
        '<span class="tag" style="--t:' + cc(t.category) + '">' + esc(t.category) + '</span>' +
        (t.priority === 'Must' ? '<span class="tag" style="--t:' + PRI.Must + '">▲ Must</span>' : '') + '</div></div>' +
        '<button class="sw' + (t.active ? ' on' : '') + '" data-act="tpl-active" data-id="' + esc(t.id) + '" aria-label="চালু/বন্ধ" style="align-self:center"></button>' +
        '</article>';
    }).join('');
  }
  h += '<div class="foot">শুক্রবার ও ছুটির দিনে রুটিনের কাজ তৈরি হয় না। মাসিক কাজের দিন ছুটি হলে পরের কর্মদিবসে আসে।</div>';
  v.innerHTML = h;
}

function tplPayload(t, over) {
  return Object.assign({
    id: t.id, task: t.task, category: t.category, priority: t.priority, repeat: t.repeat,
    weekdays: t.weekdays || tplWeekdays(t.days), monthDay: t.monthDay || Number(t.days) || 1,
    start: t.start, end: t.end, active: t.active
  }, over || {});
}

async function toggleTemplate(id) {
  const t = (S.templates || []).filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  t.active = !t.active;
  fillRoutine();
  try {
    S.templates = await api('apiSaveTemplate', tplPayload(t));
    toast(t.active ? 'রুটিন চালু' : 'রুটিন বন্ধ');
  } catch (e) { t.active = !t.active; toast('ব্যর্থ: ' + e.message); }
  if (S.tab === 'routine') fillRoutine();
}

function openTplEditor(t) {
  T = t ? {
    id: t.id, task: t.task, category: t.category, priority: t.priority, repeat: t.repeat,
    weekdays: tplWeekdays(t.days), monthDay: t.repeat === 'Monthly' ? (Number(t.days) || 1) : 1,
    start: t.start, end: t.end, active: t.active
  } : {
    id: '', task: '', category: 'Task', priority: 'Should', repeat: 'Daily',
    weekdays: [], monthDay: 1, start: '', end: '', active: true
  };
  renderTplEditor();
  openSheet();
  if (!t) setTimeout(function () { const x = $('#tTask'); if (x) x.focus(); }, 280);
}

      '<input id="tDay" class="inp" type="number" min="1" max="31" inputmode="numeric" value="' + T.monthDay + '">' +
      '<div class="hint">৩১ দিলে ছোট মাসে শেষ দিনে তৈরি হবে</div></div>';
  }

    '<div class="grab"></div>' +
    '<div class="sh-head"><h2>' + (isNew ? 'নতুন রুটিন' : 'রুটিন এডিট') + '</h2>' +
    '<button class="x" data-act="close" aria-label="বন্ধ">' + ic('x') + '</button></div>' +
    '<input id="tTask" class="inp ttl-inp" placeholder="কী কাজ? যেমন: Daily sales report" value="' + esc(T.task) + '">' +
    '<div class="fld"><div class="lbl">কত দিন পরপর</div><div class="seg">' +
      Object.keys(rep).map(function (r) {
        return '<button class="' + (T.repeat === r ? 'on' : '') + '" style="--c:#7C3AED" data-act="t-rep" data-v="' + r + '">' + rep[r] + '</button>';
      }).join('') + '</div></div>' +
    when +
    '<div class="fld"><div class="lbl">ক্যাটাগরি</div><div class="chips">' +
      S.boot.categories.map(function (c) {
        return '<button class="chip sm' + (T.category === c ? ' on' : '') + '" style="--c:' + cc(c) + '" data-act="t-cat" data-v="' + esc(c) + '"><span class="dot"></span>' + esc(c) + '</button>';
      }).join('') + '</div></div>' +

      S.boot.priorities.map(function (p) {
        return '<button class="' + (T.priority === p ? 'on' : '') + '" style="--c:' + PRI[p] + '" data-act="t-pri" data-v="' + p + '">' + p + '</button>';

      '<span class="dash">থেকে</span>' +
      '<div class="tin"><input type="time" id="tEnd" class="inp" value="' + T.end + '"><button class="clr" data-act="f-clear" data-v="tEnd" aria-label="মুছুন">' + ic('x', 13) + '</button></div>' +

    '<div class="ferr" id="fErr"></div>' +
    '<div class="sh-act">' +
      (isNew ? '' : '<button class="btn danger icon" data-act="tpl-del" aria-label="মুছুন">' + ic('trash') + '</button>') +
      '<button class="btn primary grow" data-act="tpl-save">' + (isNew ? 'রুটিন যোগ করুন' : 'সেভ করুন') + '</button>' +

function readTplForm() {
  T.task = $('#tTask').value;
  T.start = $('#tStart').value; T.end = $('#tEnd').value;
  const d = $('#tDay');
  if (d) T.monthDay = Number(d.value) || 1;
}

async function saveTemplate(btn) {
  readTplForm();
  if (!T.task.trim()) return formError('রুটিনের নাম লিখুন।');
  btn.classList.add('loading'); formError('');
  try {
    S.templates = await api('apiSaveTemplate', tplPayload(T));
    const wasNew = !T.id;
    closeSheet();
    toast(wasNew ? 'রুটিন যোগ হয়েছে — রাতে কাজ তৈরি হবে' : 'রুটিন সেভ হয়েছে ✓');
    fillRoutine();
  } catch (e) { btn.classList.remove('loading'); formError(e.message); }
}

async function deleteTemplate() {
  const ok = await ask('রুটিন মুছবেন?', '“' + T.task + '” আর তৈরি হবে না। আগে তৈরি হওয়া কাজগুলো থেকে যাবে।', { ok: 'মুছে ফেলুন', danger: true });
  if (!ok) return;
  const id = T.id;
  closeSheet();
  try { S.templates = await api('apiDeleteTemplate', id); toast('রুটিন মুছে ফেলা হয়েছে'); }
  catch (e) { toast('ব্যর্থ: ' + e.message); }
  fillRoutine();
}

/* ---------- রিপোর্ট ---------- */
async function loadInsights() {
  if (S.loadingIns) return;
  S.loadingIns = true;
  try { S.insights = await api('apiInsights'); }
  catch (e) { S.insights = null; toast('লোড ব্যর্থ: ' + e.message); }
  S.loadingIns = false;
  if (S.tab === 'insights' && S.insights) fillInsights();
}

function bar(name, o, color) {
  return '<div class="b"><div class="bh"><b>' + esc(name) + '</b><span>' + o.d + '/' + o.t + ' · ' + pct(o) + '%</span></div>' +
    '<div class="track"><i style="width:' + pct(o) + '%;--c:' + color + '"></i></div></div>';
}

function trendChart(list) {
  if (!list.length) return '<div class="none-day">এখনো ডেটা নেই — প্রতি রাতে History-তে যোগ হয়</div>';
  const max = Math.max.apply(null, list.map(function (h) { return h.total; }).concat([1]));
  return '<div class="trend">' + list.map(function (h) {
    const tot = Math.round(h.total / max * 100), dn = h.total ? Math.round(h.done / h.total * 100) : 0;
    return '<div class="tcol" title="' + esc(h.dateKey + ' — ' + h.done + '/' + h.total) + '">' +
      '<div class="tbar"><div class="tot" style="height:' + tot + '%"><i style="height:' + dn + '%"></i></div></div>' +
      '<div class="tlbl' + (h.dateKey === todayKey() ? ' now' : '') + '">' + bnNum(+h.dateKey.slice(8)) + '<br>' + BN_WEEK[dow(h.dateKey)].slice(0, 1) + '</div></div>';
  }).join('') + '</div>' +
  '<div class="legend"><span><i style="background:var(--hero-2)"></i>সম্পন্ন</span><span><i style="background:var(--surface-3)"></i>মোট</span></div>';
}

function miniRow(i) {
  const time = timeText(i);
  return '<div class="lrow" style="--c:' + cc(i.category) + '" data-act="edit" data-row="' + i.row + '">' +
    '<span class="dot"></span><span class="lt">' + esc(i.task) + '</span>' +
    '<span class="ls">' + esc(relLabel(i.date)) + (time ? ' · ' + time : '') + (i.rollover ? ' · ' + i.rollover + '×' : '') + '</span></div>';
}

function toolBtn(name) {
  const t = TOOLS[name];
  return '<button class="tool" style="--c:' + t[3] + '" data-act="tool" data-tool="' + name + '">' +
    '<span class="ti">' + ic(t[2], 17) + '</span><span style="min-width:0"><b>' + t[0] + '</b><span>' + t[1] + '</span></span></button>';
}

function fillInsights() {
  const v = $('#view');
  if (!S.insights) { v.innerHTML = '<div class="sk" style="height:110px"></div>' + skel(3); loadInsights(); return; }
  const I = S.insights, tp = pct(I.today);

    '<div class="tiles">' +
      '<div class="tile" style="--c:#6366F1"><div class="k">সাপ্তাহিক</div><div class="v">' + pct(I.week) + '%</div><div class="s">' + I.week.d + '/' + I.week.t + ' সম্পন্ন</div></div>' +
      '<div class="tile" style="--c:#059669"><div class="k">মাসিক</div><div class="v">' + pct(I.month) + '%</div><div class="s">' + I.month.d + '/' + I.month.t + ' সম্পন্ন</div></div>' +
    '</div>' +
    '<div class="panel"><h3>' + ic('chart') + ' প্রতিদিনের অগ্রগতি<small>শেষ ১৪ কর্মদিবস</small></h3>' + trendChart(I.trend) + '</div>' +
    '<div class="panel"><h3>' + ic('flag') + ' প্রায়োরিটি অনুযায়ী<small>৩০ দিন</small></h3><div class="bars">' +
      I.priority.map(function (p) { return bar(p.name, p, PRI[p.name] || '#64748B'); }).join('') + '</div></div>' +
    (I.category.length ? '<div class="panel"><h3>' + ic('grid') + ' ক্যাটাগরি অনুযায়ী<small>৩০ দিন</small></h3><div class="bars">' +
      I.category.map(function (c) { return bar(c.name, c, cc(c.name)); }).join('') + '</div></div>' : '') +

/* ---------- নিরাপত্তা (শুধু মালিক দেখেন) ----------

async function loadSecurity() {
  if (S.loadingSec) return;
  S.loadingSec = true;
  try { S.security = await api('apiSecurity'); }
  catch (e) { S.security = { error: e.message }; }
  S.loadingSec = false;
  if (S.tab === 'more') fillMore();

function agoText(ms) {
  if (!ms) return 'অনেক আগে';
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 15) return 'এখন সক্রিয়';   // সার্ভার ১০ মিনিটে একবার সময় লেখে
  if (m < 60) return bnNum(m) + ' মিনিট আগে';
  const h = Math.round(m / 60);
  if (h < 24) return bnNum(h) + ' ঘণ্টা আগে';
  return bnNum(Math.round(h / 24)) + ' দিন আগে';
}

/* লগইনের সময় সার্ভারে যায় — ডিভাইসের তালিকায় চেনার জন্য */
function deviceName() {
  const u = navigator.userAgent;
  const os = /Android/i.test(u) ? 'Android' : /iPhone|iPad|iPod/i.test(u) ? 'iPhone/iPad' :
             /Windows/i.test(u) ? 'Windows' : /Mac OS X/i.test(u) ? 'Mac' : /Linux/i.test(u) ? 'Linux' : 'অজানা';
  const br = /Edg\//.test(u) ? 'Edge' : /OPR\//.test(u) ? 'Opera' : /SamsungBrowser/.test(u) ? 'Samsung Internet' :
             /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'ব্রাউজার';
  return os + ' · ' + br + (/github\.io$/.test(location.hostname) ? ' · ওয়েবসাইট' : ' · Apps Script লিংক');
}

      '<span>' + esc(s.email) + ' · ' + agoText(s.last) + '</span></div>' +

    '<button class="btn primary" data-act="sec-user-add" aria-label="যোগ করুন">' + ic('plus') + '</button></div>' +
    '<div class="hint">তালিকার বাইরের কোনো ইমেইলে কোড যায় না — লিংক পেলেও কেউ ঢুকতে পারবে না। ' +
      'কেউ চেষ্টা করলে বা নতুন লগইন হলে আপনার Telegram-এ (না থাকলে ইমেইলে) খবর যায়।</div>' +
    '<div class="sec-h">লগইন থাকা ডিভাইস<small>' + bnNum(X.sessions.length) + 'টা</small></div>' +

}
