/* ---------- রিপোর্ট ভিউয়ার — অ্যাপের ভেতরে PDF-এর মতো পাতা ----------
 * রিপোর্ট ট্যাব → তারিখ + রিপোর্ট বাছাই → পুরো পর্দায় সাদা পাতা (◀ ▶ দিয়ে আগের/পরের দিন-সপ্তাহ-মাস)।
 * ⬇ PDF: একই পাতা পর্দার বাইরে A4 মাপে এঁকে (html2canvas) jsPDF-এ — বাংলা লেখাও ঠিক আসে, কারণ
 * ব্রাউজার নিজেই অক্ষর আঁকে। সারি/অংশের মাঝখান দিয়ে পাতা কাটে না। লাইব্রেরি শুধু প্রথম PDF-এ লোড হয়।
 * শেয়ার: ফোনে PDF ফাইলটাই WhatsApp/ইমেইলে; প্রিন্ট: ব্রাউজারের প্রিন্ট (Save as PDF-ও)। */
const REPORTS = {
  daily:   ['Daily Work Report', 'দিনের সব কাজের তালিকা', 'file', '#4F46E5'],
  eod:     ['End of Day Report', 'বাকি কাজ, সংঘর্ষ, পরের দিন', 'mail', '#D97706'],
  weekly:  ['Weekly Review', 'শেষ ৭ দিনের হিসাব', 'chart', '#059669'],
  monthly: ['Monthly Review', 'পুরো মাসের হিসাব', 'calendar', '#DB2777']
};
let RV = null;   // { kind, date, data }

function repBtn(kind) {
  const t = REPORTS[kind];
  return '<button class="tool" style="--c:' + t[3] + '" data-act="report" data-kind="' + kind + '">' +
    '<span class="ti">' + ic(t[2], 17) + '</span><span style="min-width:0"><b>' + t[0] + '</b><span>' + t[1] + '</span></span></button>';
}

function enDate(k, o) { return k2d(k).toLocaleDateString('en-GB', Object.assign({ timeZone: 'UTC', day: '2-digit', month: 'short', year: 'numeric' }, o)); }
function repRange(d) {
  if (d.kind === 'weekly' || d.kind === 'monthly') return enDate(d.from) + ' – ' + enDate(d.to);
  return enDate(d.date, { weekday: 'long' });
}
function repFile(d) { return REPORTS[d.kind][0].replace(/ /g, '-') + '_' + (d.from ? d.from + '_to_' + d.to : d.date) + '.pdf'; }

function openReport(kind, dateKey) {
  if (!REPORTS[kind]) return;
  if (!dateKey || dateKey > todayKey()) dateKey = todayKey();
  RV = { kind: kind, date: dateKey, data: null };
  $('#rv').classList.add('open');
  document.body.classList.add('lock');
  drawRv();
  loadReport();
}
function closeReport() {
  RV = null;
  $('#rv').classList.remove('open'); $('#rv').innerHTML = '';
  document.body.classList.remove('lock');
}
async function loadReport() {
  const want = RV && RV.kind + '|' + RV.date;
  try {
    const d = await api('apiReport', RV.kind, RV.date);
    if (!RV || RV.kind + '|' + RV.date !== want) return;   // এর মাঝে অন্য দিন/রিপোর্ট বাছাই হয়েছে
    RV.data = d; drawRv();
  } catch (e) {
    if (!RV || RV.kind + '|' + RV.date !== want) return;
    $('#rvBody').innerHTML = '<div class="rv-load" style="text-align:center;color:#B91C1C;font-weight:700">লোড ব্যর্থ: ' + esc(e.message) + '</div>';
  }
}
// ◀ ▶ — দৈনিক/EOD: এক দিন, সাপ্তাহিক: ৭ দিন, মাসিক: এক মাস (আজকের পরে যায় না)
function stepReport(n) {
  if (!RV) return;
  let k;
  if (RV.kind === 'monthly') {
    const d = k2d(RV.date.slice(0, 8) + '01'); d.setUTCMonth(d.getUTCMonth() + n);
    k = d2k(d);
    if (n > 0) { const end = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)); k = d2k(end); }
  } else k = addDays(RV.date, RV.kind === 'weekly' ? 7 * n : n);
  if (k > todayKey()) k = todayKey();
  if (k === RV.date) return;
  RV.date = k; RV.data = null; RV.pdf = null; drawRv(); loadReport();
}

function drawRv() {
  const d = RV.data, t = REPORTS[RV.kind], atEnd = d ? (d.to || d.date) >= todayKey() : RV.date >= todayKey();
  $('#rv').innerHTML =
    '<div class="rv-bar">' +
      '<button class="rv-ib" data-act="rv-close" aria-label="বন্ধ">' + ic('x', 20) + '</button>' +
      '<div class="t">' + esc(t[0]) + '<small>' + (d ? esc(repRange(d)) : 'লোড হচ্ছে…') + '</small></div>' +
      (navigator.share ? '<button class="rv-ib" data-act="rv-share" title="শেয়ার"' + (d ? '' : ' disabled') + '>' + ic('share', 18) + '</button>' : '') +
      '<button class="rv-ib" data-act="rv-print" title="প্রিন্ট"' + (d ? '' : ' disabled') + '>' + ic('printer', 18) + '</button>' +
      '<button class="rv-ib pri" data-act="rv-pdf"' + (d ? '' : ' disabled') + '>' + ic('download', 17) + ' PDF</button>' +
    '</div>' +
    '<div class="rv-nav">' +
      '<button class="rv-ib" data-act="rv-step" data-v="-1" aria-label="আগের">' + ic('chevL', 18) + '</button>' +
      '<span>' + esc(RV.kind === 'monthly' ? k2d(RV.date).toLocaleDateString('en-GB', { timeZone: 'UTC', month: 'long', year: 'numeric' })
                : RV.kind === 'weekly' ? 'Week ending ' + enDate(RV.date) : enDate(RV.date, { weekday: 'short' })) + '</span>' +
      '<button class="rv-ib" data-act="rv-step" data-v="1" aria-label="পরের"' + (atEnd ? ' disabled' : '') + '>' + ic('chevR', 18) + '</button>' +
    '</div>' +
    '<div class="rv-body" id="rvBody">' + (d ? repPage(d) :
      '<div class="rv-load"><div class="sk" style="height:60px;margin-bottom:14px"></div><div class="sk" style="height:40px;margin-bottom:14px"></div><div class="sk" style="height:220px"></div></div>') +
    '</div>';
}

/* ---- পাতা ---- */
function repPage(d) {
  const t = REPORTS[d.kind];
  let html = '<div class="rp">' +
    '<div class="rp-head"><img class="rp-logo" src="' + ORG_LOGO + '" alt="">' +
      '<div class="rp-org">' + esc(ORG_NAME) + '</div>' +
      '<div class="rp-title">' + esc(t[0]) + '</div>' +
      '<div class="rp-meta">' + esc(OWNER_NAME) + ' &nbsp;·&nbsp; ' + esc(repRange(d)) + '</div></div>' +
    '<div class="rp-rule"></div>' +
    '<div class="rp-stats">' +
      '<div><b>' + d.total + '</b><span>Total</span></div><div><b>' + d.done + '</b><span>Completed</span></div>' +
      '<div><b>' + (d.total - d.done) + '</b><span>Pending</span></div><div><b>' + d.pct + '%</b><span>Completion</span></div></div>';

  if (d.kind === 'daily' || d.kind === 'eod') {
    html += '<div class="rp-h">Task List <small>(' + d.items.length + ')</small></div>' + repTasks(d.items, d);
    if (d.kind === 'eod') {
      html +=
        '<div class="rp-h">Pending Tasks <small>(' + d.pending.length + ')</small></div>' +
          repList(d.pending, d.items.length ? 'All tasks completed — excellent!' : 'No tasks.') +
        (d.stuck.length ? '<div class="rp-h">Repeatedly Postponed <small>— do it or drop it</small></div>' +

/* ---- PDF ---- */
const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let pdfLibs = null;
function loadPdfLibs() {
  if (pdfLibs) return pdfLibs;
  pdfLibs = Promise.all(PDF_LIBS.map(function (src) {
    return new Promise(function (ok, bad) {
      const s = document.createElement('script');
      s.src = src; s.onload = ok;
      s.onerror = function () { bad(new Error('PDF লাইব্রেরি লোড হয়নি — ইন্টারনেট দেখুন')); };
      document.head.appendChild(s);
    });
  })).catch(function (e) { pdfLibs = null; throw e; });
  return pdfLibs;
}

async function makePdf(d) {
  await loadPdfLibs();
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';
  host.innerHTML = repPage(d).replace('<div class="rp">', '<div class="rp fixed">');
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const logo = host.querySelector('.rp-logo');
    if (logo && logo.decode) { try { await logo.decode(); } catch (e) {} }
    const page = host.firstChild, top = page.getBoundingClientRect().top;
    const H = Math.ceil(page.scrollHeight);
    // পাতা কাটার নিরাপদ জায়গা — প্রতিটা সারি, তালিকার লাইন আর অংশের নিচে
    const cuts = [];
    page.querySelectorAll('tr, li, .rp-h, .rp-stats, .rp-none, .rp-head, .rp-rule').forEach(function (el) {
      const r = el.getBoundingClientRect();
      if (el.classList.contains('rp-h')) cuts.push(Math.floor(r.top - top));   // শিরোনাম পাতার নিচে একা পড়ে না
      cuts.push(Math.ceil(r.bottom - top));
    });
    cuts.sort(function (a, b) { return a - b; });

    const canvas = await html2canvas(page, { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 794 });
    const PH = 1123, M = 44, U = PH - 2 * M;    // A4 = 794×1123 px; উপরে-নিচে ৪৪px মার্জিন
    const slices = [];
    let start = 0;
    while (start < H - 2) {
      let cut = start + U;
      if (cut >= H) cut = H;
      else {
        let best = 0;
        cuts.forEach(function (c) { if (c > start + 150 && c <= cut) best = c; });
        if (best) cut = best;
      }
      slices.push([start, cut]); start = cut;
    }

    const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
    const k = pdf.internal.pageSize.getWidth() / 794, sc = canvas.width / 794;
    slices.forEach(function (s, i) {
      const h = s[1] - s[0], c = document.createElement('canvas');
      c.width = canvas.width; c.height = Math.ceil(h * sc);
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(canvas, 0, Math.floor(s[0] * sc), canvas.width, c.height, 0, 0, c.width, c.height);
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, M * k, 794 * k, h * k);
      pdf.setFontSize(8); pdf.setTextColor(140);
      pdf.text('Page ' + (i + 1) + ' of ' + slices.length, 794 * k / 2, (PH - 18) * k, { align: 'center' });
    });
    return pdf.output('blob');
  } finally { host.remove(); }
}

async function rvPdf(btn, share) {
  if (!RV || !RV.data) return;
  const rv = RV, d = rv.data, name = repFile(d);
  const download = function (blob, msg) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
    toast(msg);
  };
  btn.disabled = true;
  try {
    // একবার বানানো PDF মনে থাকে — দ্বিতীয়বার চাপলে সাথে সাথে
    const fresh = !rv.pdf;
    if (fresh) { toast('PDF তৈরি হচ্ছে…', true); rv.pdf = await makePdf(d); }
    const blob = rv.pdf;
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/pdf' }) : null;
    if (share && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: REPORTS[d.kind][0] }); toast('শেয়ার হয়েছে ✓'); }
      catch (e) {
        if (e && e.name === 'AbortError') toast('শেয়ার বাতিল');
        // PDF বানাতে সময় লাগলে ব্রাউজার শেয়ারের অনুমতি হারায় — এবার PDF তৈরি, আরেকবার চাপলেই হবে
        else if (fresh && e && e.name === 'NotAllowedError') toast('PDF তৈরি ✓ — শেয়ার বোতামটা আরেকবার চাপুন');
        else download(blob, 'শেয়ার হলো না — PDF ডাউনলোড হয়েছে');
      }
    } else download(blob, share ? 'এখানে শেয়ার হয় না — PDF ডাউনলোড হয়েছে' : 'PDF ডাউনলোড হয়েছে ✓');
  } catch (e) { toast('PDF ব্যর্থ: ' + e.message); }
  btn.disabled = false;
}

let dlgResolve = null;
function ask(title, msg, opt) {
  opt = opt || {};
  return new Promise(function (resolve) {
    dlgResolve = resolve;
    $('#dlg').innerHTML = '<div class="dlg-box"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><div class="dlg-act">' +
      (opt.info ? '' : '<button class="btn ghost" data-dlg="0">বাতিল</button>') +
      '<button class="btn ' + (opt.danger ? 'danger solid' : 'primary') + '" data-dlg="1">' + esc(opt.ok || 'ঠিক আছে') + '</button></div></div>';
    $('#dlg').classList.add('open');
  });
}
function closeDlg(val) {
  $('#dlg').classList.remove('open');
  if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(val); }
}
$('#dlg').addEventListener('click', function (e) {
  const b = e.target.closest('[data-dlg]');
  if (b) closeDlg(b.dataset.dlg === '1');
  else if (e.target.id === 'dlg') closeDlg(false);
});

// stay = কাজ চলাকালীন বার্তা — পরের বার্তা না আসা পর্যন্ত থাকে
function toast(msg, stay) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  if (!stay) window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, msg.length > 40 ? 4000 : 2200);
}

/* ---------- ন্যাভিগেশন ---------- */
function setTab(tab) {
  if (S.tab === tab) return;
  S.tab = tab; S.sel = null;
  window.scrollTo(0, 0);
  render();
  if (tab === 'tasks' && (S.stale || Date.now() - S.loadedAt > 60000)) loadList(true);
}

function setMode(mode) {
  if (S.mode === mode) return;
  S.mode = mode; S.filter = 'all'; S.sel = null;
  if (mode === 'week') S.weekStart = weekStartOf(S.date);
  if (mode !== 'search') S.items = [];
  render();
  loadList();
}

function pickDay(k) {
  S.date = k; S.sel = null;
  if (k < addDays(S.stripStart, 1) || k > addDays(S.stripStart, 12)) S.stripStart = addDays(k, -3);
  S.filter = 'all';
  loadList();
}

async function refresh() {
  S.refreshing = true; renderHero();
  try {
    if (S.tab === 'tasks') await loadList(true);
    else if (S.tab === 'routine') { S.templates = null; fillRoutine(); }
    else if (S.tab === 'insights') { S.insights = null; fillInsights(); }
    else { S.holidays = null; fillMore(); }
  } finally {
    setTimeout(function () { S.refreshing = false; renderHero(); }, 400);
  }
}

/* ---------- সব ক্লিক এক জায়গায় ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, row = el.dataset.row;
  // সার্ভার থেকে কনফিগ আসার আগে শুধু লগইনের বোতাম চলে
  if (!S.boot && a.indexOf('lg-') !== 0) return;

  switch (a) {
    case 'lg-send':   loginSend(el); break;
    case 'lg-verify': loginVerify(el); break;
    case 'lg-back':   S.login = { step: 'email', email: S.login ? S.login.email : '' }; showLogin(); break;
    case 'logout':    logout(); break;

    case 'tab':        setTab(v); break;
    case 'mode':       setMode(v); break;
    case 'side-mode':  setTab('tasks'); setMode(v); break;
    case 'side-new':
      if (S.tab === 'routine') openTplEditor(null);
      else { setTab('tasks'); openEditor(null); }
      break;

    // নির্বাচন — একসাথে অনেক কাজ
    case 'sel-mode':   if (S.sel) stopSelect(); else startSelect(); break;
    case 'sel-exit':   stopSelect(); break;
    case 'sel-all':    pickAll(); break;
    case 'pick':       pickRow(Number(row)); break;
    case 'bulk-done':  bulkPatch({ status: 'Done' }, '%nটা কাজ সম্পন্ন ✓'); break;
    case 'bulk-todo':  bulkPatch({ status: S.boot.statuses[0] || 'To Do' }, '%nটা কাজ আবার বাকির তালিকায়'); break;
    case 'bulk-status': openChooser('status'); break;
    case 'bulk-date':  openChooser('date'); break;
    case 'bulk-del': {
      const list = selectedItems();
      if (list.length) deleteItems(list).then(function (ok) { if (ok) stopSelect(); });
      break;
    }
    case 'opt-status': bulkPatch({ status: v }, '%nটা কাজ → ' + v); break;
    case 'opt-date':   bulkPatch({ date: v }, '%nটা কাজ সরানো হলো — ' + relLabel(v) + ', ' + shortDate(v)); break;
    case 'opt-date-go': {
      const d = ($('#optDate') || {}).value;
      if (!d) { toast('তারিখ বাছুন'); break; }
      bulkPatch({ date: d }, '%nটা কাজ সরানো হলো — ' + relLabel(d) + ', ' + shortDate(d));
      break;
    }
    case 'all-done':      allDone(); break;
    case 'overdue-today': overdueToday(); break;
    case 'refresh':    refresh(); break;
    case 'pick-day':   pickDay(el.dataset.k); break;
    case 'strip-prev': S.stripStart = addDays(S.stripStart, -7); S.date = addDays(S.date, -7); loadList(); break;
    case 'strip-next': S.stripStart = addDays(S.stripStart, 7);  S.date = addDays(S.date, 7);  loadList(); break;
    case 'week-prev':  S.weekStart = addDays(S.weekStart, -7); loadList(); break;
    case 'week-next':  S.weekStart = addDays(S.weekStart, 7);  loadList(); break;
    case 'filter':     S.filter = v; fillTasks(); break;
    case 'done-sec':   S.doneOpen = !S.doneOpen; fillList(); break;
    case 'toggle':     toggle(Number(row)); break;
    case 'move':       moveToToday(Number(row)); break;
    case 'edit':       { const it = findItem(row); if (it) openEditor(it); break; }
    case 'add-on':     openEditor(null, { date: el.dataset.k }); break;
    case 'quick-add':  quickAdd(); break;
    case 'quick-form': quickForm(); break;
    case 'fab':        if (S.tab === 'routine') openTplEditor(null); else openEditor(null); break;
    case 'close':      closeSheet(); break;

    // কাজের ফর্ম
    case 'f-cat':  F.category = v; pickIn(el, a); $('#gHint').textContent = guestHint(v); break;
    case 'f-pri':  F.priority = v; pickIn(el, a); break;
    case 'f-sta':  F.status = v; pickIn(el, a); break;
    case 'f-date': $('#fDate').value = v; F.date = v; pickIn(el, a); break;
    case 'f-clear': { const inp = document.getElementById(v); if (inp) inp.value = ''; break; }
    case 'f-save': saveTask(el); break;
    case 'f-del':  deleteTask(); break;
    case 'f-copy':
      readForm();
      F.ref = null; F.status = 'To Do'; F.source = 'app'; F.rollover = 0; F.onCalendar = false;
      renderEditor(); toast('কপি — তারিখ বদলে "যোগ করুন" চাপুন');
      break;

    // রুটিন
    case 'tpl-edit': {
      const t = (S.templates || []).filter(function (x) { return x.id === el.dataset.id; })[0];
      if (t) openTplEditor(t);
      break;
    }
    case 'tpl-active': e.stopPropagation(); toggleTemplate(el.dataset.id); break;
    case 't-rep':  readTplForm(); T.repeat = v; renderTplEditor(); break;
    case 't-cat':  T.category = v; pickIn(el, a); break;
    case 't-pri':  T.priority = v; pickIn(el, a); break;
    case 't-act':  T.active = !T.active; el.classList.toggle('on', T.active); break;
    case 't-wd': {
      const i = T.weekdays.indexOf(v);
      if (i === -1) T.weekdays.push(v); else T.weekdays.splice(i, 1);
      el.classList.toggle('on', i === -1);
      break;
    }
    case 'tpl-save': saveTemplate(el); break;
    case 'tpl-del':  deleteTemplate(); break;

    // টুলস ও সেটিংস
    case 'tool':    runTool(el.dataset.tool, el); break;
    case 'hol-add': addHoliday(el); break;
    case 'hol-del': deleteHoliday(el.dataset.k); break;
    case 'tg-save': saveTelegram(el); break;
    case 'owner-save': saveOwner(el); break;
    case 'sec-user-add': secAddUser(el); break;
    case 'sec-user-del': secRemoveUser(el.dataset.e); break;
    case 'sec-sess-del': secRevoke(el.dataset.id); break;
    case 'sec-sess-all': secRevokeOthers(el); break;
    case 'sec-reload':   S.security = null; fillMore(); break;
    case 'report':  openReport(el.dataset.kind, ($('#printDate') || {}).value || todayKey()); break;
    case 'rv-close': closeReport(); break;
    case 'rv-step':  stepReport(Number(v)); break;
    case 'rv-pdf':   rvPdf(el, false); break;
    case 'rv-share': rvPdf(el, true); break;
    case 'rv-print': rvPrint(); break;
  }
});

async function allDone() {
  const list = visibleItems().filter(function (i) { return !i.done; });
  if (!list.length) return;
  if (!(await ask('সব কাজ Done করবেন?', bnNum(list.length) + 'টা বাকি কাজ একসাথে সম্পন্ন হিসেবে চিহ্নিত হবে।', { ok: 'হ্যাঁ, সব Done' }))) return;
  patchItems(list, { status: 'Done' }, bnNum(list.length) + 'টা কাজ সম্পন্ন ✓');
}

async function overdueToday() {
  const list = visibleItems().filter(function (i) { return !i.done; });
  if (!list.length) return;
  if (!(await ask('সব বকেয়া আজকে আনবেন?', bnNum(list.length) + 'টা বকেয়া কাজ আজকের তালিকায় চলে আসবে।', { ok: 'হ্যাঁ, আজকে আনুন' }))) return;
  patchItems(list, { date: todayKey() }, bnNum(list.length) + 'টা কাজ আজকের তালিকায় আনা হয়েছে');
}

/* ফোনে কাজের উপর আঙুল চেপে ধরলে নির্বাচন শুরু (সেই কাজটা বাছাই হয়ে) */
let lpTimer = null, lpFired = false;
document.addEventListener('pointerdown', function (e) {
  const c = e.target.closest('.card[data-row]');
  if (!c || S.sel || S.tab !== 'tasks' || e.target.closest('.chk, .mini') || e.button > 0) return;
  lpFired = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(function () {
    lpFired = true;
    startSelect(Number(c.dataset.row));
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} }
  }, 550);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
  document.addEventListener(t, function () { clearTimeout(lpTimer); });
});
window.addEventListener('scroll', function () { clearTimeout(lpTimer); }, { passive: true });
// চেপে ধরার পরের "ক্লিক"টা যেন কাজটা খুলে না ফেলে
document.addEventListener('click', function (e) {
  if (lpFired) { lpFired = false; e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('contextmenu', function (e) {
  if (e.target.closest('.card[data-row]') && (lpFired || S.sel)) e.preventDefault();
});

document.addEventListener('change', function (e) {
  if (e.target.id === 'pickDate' && e.target.value) {
    S.stripStart = addDays(e.target.value, -3);
    pickDay(e.target.value);
  }
  if (e.target.id === 'fDate' && F) {
    F.date = e.target.value;
    document.querySelectorAll('[data-act="f-date"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === F.date); });
  }
});

let searchTimer = null;
document.addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () { S.q = e.target.value; loadList(); }, 350);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'quick') { e.preventDefault(); quickAdd(); }
  if (e.key === 'Enter' && e.target.id === 'lgEmail') { e.preventDefault(); const b = $('[data-act="lg-send"]'); if (b) loginSend(b); }
  if (e.key === 'Enter' && e.target.id === 'lgCode')  { e.preventDefault(); const b = $('[data-act="lg-verify"]'); if (b) loginVerify(b); }
  if (e.key === 'Escape') {
    if ($('#dlg').classList.contains('open')) closeDlg(false);
    else if (RV) closeReport();
    else if ($('#sheet').classList.contains('open')) closeSheet();
    else if (S.sel) stopSelect();
  }
});

// অ্যাপে ফিরে এলে (অন্য ট্যাব/অ্যাপ থেকে) এক মিনিটের পুরনো ডেটা হলে নতুন করে আনি
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.boot && S.tab === 'tasks' && Date.now() - S.loadedAt > 60000) loadList(true);
});

/* ---------- লগইন (মালিক ছাড়া অন্যদের জন্য) ---------- */
function showLogin() {
  // লগইন পাতার উপর PIN লক যেন না বসে — লগইনের পর লক নিজে আসে (GitHub সাইটের লক)
  if (window.appLockWaitLogin) appLockWaitLogin();
  if (window.NTF) NTF.stop();
  S.boot = null; S.viewKey = ''; S.security = null; S.sel = null;
  document.body.classList.remove('selecting');
  if (!S.login) S.login = { step: 'email', email: '' };
  closeSheet();
  $('#nav').innerHTML = '';
  $('#fab').style.display = 'none';
  $('#hero').innerHTML = '';
  document.body.classList.add('is-login');

  const L = S.login;
  const isEmail = L.step === 'email';
  $('#view').innerHTML =
    '<div class="lg-wrap"><div class="lg-card">' +
      '<div class="lg-head">' +
        (ORG_LOGO ? '<img class="lg-logo" src="' + ORG_LOGO + '" alt="logo" onerror="this.remove()">' : '') +
        '<div class="lg-org">' + esc(ORG_NAME) + '</div>' +
        '<div class="lg-app">TO-DO LIST</div>' +
        '<span class="owner"><i>' + ic('user', 11) + '</i>' + esc(OWNER_NAME) + '</span>' +
      '</div>' +
      '<div class="lg-body">' +
        (isEmail
          ? '<h2>' + ic('key', 20) + ' লগইন</h2>' +
            '<p class="lg-sub">আপনার ইমেইল দিন — অনুমতির তালিকায় থাকলে ৬ সংখ্যার একটা কোড যাবে।</p>' +
            '<input id="lgEmail" class="inp" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com" value="' + esc(L.email) + '">' +
            '<div class="lg-actions"><button class="btn primary grow" data-act="lg-send">' + ic('mail', 16) + ' কোড পাঠাও</button></div>'
          : '<h2>' + ic('mail', 20) + ' কোড দিন</h2>' +
            '<p class="lg-sub">ইমেইলটা অনুমতির তালিকায় থাকলে <b>' + esc(L.email) + '</b>-এ কোড চলে গেছে। Inbox-এ না পেলে Spam দেখুন।</p>' +
            '<input id="lgCode" class="inp lg-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">' +
            '<div class="lg-actions">' +
              '<button class="btn ghost" data-act="lg-back">অন্য ইমেইল</button>' +
              '<button class="btn primary grow" data-act="lg-verify">ঢুকুন</button></div>') +
        '<div class="ferr" id="fErr"></div>' +
        '<div class="lg-steps"><i class="on"></i><i' + (isEmail ? '' : ' class="on"') + '></i></div>' +
      '</div>' +
    '</div>' +
    '<div class="lg-foot">' + ic('shield', 14) + ' একবার ঢুকলে এই ব্রাউজারে অনেক দিন আর লগইন লাগবে না।</div></div>';
  setTimeout(function () { const x = $('#lgEmail') || $('#lgCode'); if (x) x.focus(); }, 80);
}

async function loginSend(btn) {
  const email = $('#lgEmail').value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return formError('ইমেইল ঠিক নেই।');
  btn.classList.add('loading'); formError('');
  try {
    await api('apiSendCode', email);
    S.login = { step: 'code', email: email };
    showLogin();
  } catch (e) { btn.classList.remove('loading'); formError(e.message); }
}

async function loginVerify(btn) {
  const code = $('#lgCode').value.replace(/\D/g, '');
  if (code.length !== 6) return formError('৬ সংখ্যার কোড দিন।');
  btn.classList.add('loading'); formError('');
  try {
    setAuth(await api('apiVerifyCode', S.login.email, code, deviceName()));
    S.login = null;
    toast('স্বাগতম 👋');
    boot();
    // লগইনের পর PIN লক (GitHub সাইটের লক)
    if (window.appLockAfterLogin) appLockAfterLogin();
  } catch (e) { btn.classList.remove('loading'); formError(e.message); }
}

async function logout() {
  if (!(await ask('লগআউট করবেন?', 'আবার ঢুকতে ইমেইলে নতুন কোড লাগবে।', { ok: 'লগআউট' }))) return;
  if (window.NTF) await NTF.logout();   // এই ডিভাইসের Push বন্ধ
  try { await api('apiLogout'); } catch (e) {}
  setAuth('');
  S.login = { step: 'email', email: S.boot && S.boot.user ? S.boot.user.email : '' };
  showLogin();
}

/* ---------- 🔔 নোটিফিকেশন ----------
 * GitHub সাইটে ntf.js লোড হয় (window.NTF) — অ্যাপের ভেতরের তালিকা + এই ডিভাইসে Push।
 * Apps Script-এর পাতায় ntf.js নেই, তখন ঘণ্টাও দেখায় না। সার্ভার: Api-র apiNotify → Notify ফাইল। */
if (window.NTF) NTF.init({
  app: 'todo', name: 'Daily Todo', ext: 'Telegram/Gmail', sw: 'ntf-sw.js', scope: './',
  call: function (op, arg) { return api('apiNotify', op, arg); }
});

/* ---------- শুরু ---------- */
async function boot() {
  // সাইটে টোকেন নেই — সার্ভারকে না ডেকেই সরাসরি লগইন পাতা (Apps Script-এ মালিক টোকেন ছাড়াই ঢোকেন)
  if (IS_SITE && !AUTH) { S.loading = false; showLogin(); return; }
  document.body.classList.remove('is-login');
  S.loading = true; S.viewKey = '';
  render();
  try {
    const b = await api('apiBoot', listParams());
    S.boot = b;
    if (window.NTF) NTF.start();
    setOwnerName(b.ownerName);
    setHolidays(b.holidays.map(function (d) { return { date: d, reason: '' }; }));
    S.holidays = null;   // কারণসহ পুরো তালিকা "আরও" খুললে আসে
    if (b.today !== S.date) {   // ফোনের ঘড়ি আর সার্ভারের দিন না মিললে সার্ভারেরটা
      S.date = b.today; S.stripStart = addDays(b.today, -3); S.weekStart = weekStartOf(b.today);
      render(); loadList();
    } else {
      render(); applyList(b.list);
    }
  } catch (e) {
    S.loading = false;
    if (/AUTH_REQUIRED/.test(e.message)) { setAuth(''); showLogin(); return; }
    $('#hero').innerHTML = '<div class="hero-top">' + brandHead() + '</div>';
    $('#view').innerHTML = emptyBox('🔒', 'অ্যাপ খোলা যায়নি', esc(e.message),
      '<button class="btn ghost sm" onclick="boot()">আবার চেষ্টা</button>');
    $('#fab').style.display = 'none';
  }
}
boot();
</script>
